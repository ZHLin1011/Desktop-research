  <style>
    :root {
      --bg: #071018; --ink: #f4f7fb; --mute: #a8b8cc; --accent: #9ad7ff;
      --frog: #8dff9c; --panel: #0f1a24; --line: rgba(244,247,251,0.16); --warn: #ffd59a;

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      min-height: 100%;

    button:hover { border-color: rgba(154,215,255,0.45); background: #152433; }
    button.primary { background: #1a3348; border-color: rgba(154,215,255,0.55); }
    .meta { color: var(--mute); font-size: 12px; margin-left: auto; }
    .scene-list { width: min(420px, 100%); display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .scene-list button { text-align: left; padding: 8px 10px; font-size: 11px; color: var(--mute); line-height: 1.35; }
    .scene-list button.active { color: var(--ink); border-color: rgba(154,215,255,0.5); background: #152433; }

    .nav { width: min(420px, 100%); font-size: 12px; }

<body>

  <div class="stage-wrap">

  </div>

  <div class="controls">
    <button class="primary" id="btnPlay">播放</button>
    <button id="btnRestart">重来</button>
    <button id="btnMute">配音：开</button>
    <div class="meta" id="meta">场景 1 / 7</div>

  <div class="scene-list" id="sceneList"></div>
  <p class="hint">竖屏 9:16 · 底部字幕 · 顶部/底部安全边距 · 「呱基」仅开场/收尾点名</p>

  <script>
    const canvas = document.getElementById("stage");
    const ctx = canvas.getContext("2d");
    const bar = document.getElementById("bar");
    const meta = document.getElementById("meta");
    const btnPlay = document.getElementById("btnPlay");
    const btnRestart = document.getElementById("btnRestart");
    const btnMute = document.getElementById("btnMute");
    const sceneList = document.getElementById("sceneList");
    const W = canvas.width, H = canvas.height;
    const SAFE_TOP = 240, SAFE_BOTTOM = 150, SUB_H = 290;
    const CONTENT_BOTTOM = H - SAFE_BOTTOM - SUB_H;

    // durations patched after TTS
    const SCENES = [
      { id:"hook", title:"引出问题", tag:"常见疑问",
        zh:"嗨，我是呱基。地铁没信号、飞机上、断网办公——没网了，AI 还能跑吗？答案是：看你用的是哪种 AI。",
        voice:"嗨，我是呱基。地铁没信号、飞机上、断网办公——没网了，AI 还能跑吗？答案是：看你用的是哪种 AI。",
        duration:10180 },
      { id:"two", title:"两种 AI", tag:"总览",
        zh:"常见有两种：端侧模型，装在你手机或电脑里；云端模型，跑在远程的算力中心。一个在身边，一个在远方。",
        voice:"常见有两种：端侧模型，装在你手机或电脑里；云端模型，跑在远程的算力中心。一个在身边，一个在远方。",
        duration:10012 },
      { id:"edge", title:"端侧怎么跑", tag:"原理 · 端侧",
        zh:"端侧，就是把模型文件下载、部署到设备上。推理靠本机芯片的算力——CPU、GPU、NPU。算力在你口袋里，所以可以不依赖网络。",
        voice:"端侧，就是把模型文件下载、部署到设备上。推理靠本机芯片的算力——CPU、GPU、NPU。算力在你口袋里，所以可以不依赖网络。",
        duration:12580 },
      { id:"cloud", title:"云端怎么跑", tag:"原理 · 云端",
        zh:"云端呢？你的问题通过网络，送到机房里的大服务器。真正费算力的活，在远程算力中心完成，再把答案传回来。没网，这条路就断了。",
        voice:"云端呢？你的问题通过网络，送到机房里的大服务器。真正费算力的活，在远程算力中心完成，再把答案传回来。没网，这条路就断了。",
        duration:12148 },
      { id:"edgepc", title:"端侧优劣", tag:"对比",
        zh:"端侧好处：能离线、数据更不容易离开本机、本地响应往往更快。代价是：模型通常更小、能力有限，还占存储、比较费电。",
        voice:"端侧好处：能离线、数据更不容易离开本机、本地响应往往更快。代价是：模型通常更小、能力有限，还占存储、比较费电。",
        duration:11764 },
      { id:"cloudpc", title:"云端优劣", tag:"对比",
        zh:"云端好处：模型往往更大更强，功能更新也快。代价是：必须联网；内容会经过远端；高峰时还可能排队变慢。",
        voice:"云端好处：模型往往更大更强，功能更新也快。代价是：必须联网；内容会经过远端；高峰时还可能排队变慢。",
        duration:10588 },
      { id:"end", title:"怎么选", tag:"干货 · 收尾",
        zh:"怎么选？要离线、要隐私、要随手秒回——优先端侧。要复杂推理、长文创作、最新能力——用云端。很多 App 其实两边都会用。我是呱基，我们下期见。",
        voice:"怎么选？要离线、要隐私、要随手秒回——优先端侧。要复杂推理、长文创作、最新能力——用云端。很多 App 其实两边都会用。我是呱基，我们下期见。",
        duration:14788 },
    ];

    let playing=false, muted=false, sceneIndex=0, sceneStart=0, raf=0, seed=1;
    function rand(){ seed=(seed*16807)%2147483647; return (seed-1)/2147483646; }
    function wobble(a=2.8){ return (rand()-0.5)*a; }
    function easeOut(t){ return 1-Math.pow(1-Math.min(1,Math.max(0,t)),3); }
    function clamp01(t){ return Math.min(1,Math.max(0,t)); }

    function clear(){
      ctx.fillStyle="#071018"; ctx.fillRect(0,0,W,H);
      seed=11; ctx.fillStyle="rgba(255,255,255,0.035)";
      for(let i=0;i<220;i++) ctx.fillRect(rand()*W, rand()*H, 1.8, 1.8);
    }
    function chalkStroke(points, opts={}){
      const {color="rgba(244,247,251,0.94)", width=3.2, alpha=1}=opts;
      if(points.length<2) return;
      const drawOnce=(amp,wMul,aMul)=>{
        ctx.save(); ctx.globalAlpha=alpha*aMul;
        ctx.strokeStyle=color; ctx.lineWidth=width*wMul; ctx.lineCap="round"; ctx.lineJoin="round";
        ctx.beginPath();
        ctx.moveTo(points[0].x+wobble(amp), points[0].y+wobble(amp));
        for(let i=1;i<points.length;i++){
          const p=points[i], prev=points[i-1];
          ctx.quadraticCurveTo(prev.x+wobble(amp*0.9), prev.y+wobble(amp*0.9), (prev.x+p.x)/2+wobble(amp), (prev.y+p.y)/2+wobble(amp));
        }
        const last=points[points.length-1];
        ctx.lineTo(last.x+wobble(amp*0.4), last.y+wobble(amp*0.4));
        ctx.stroke(); ctx.restore();
      };
      drawOnce(2.4,1,1); drawOnce(3.6,1.7,0.2); drawOnce(1.4,0.7,0.35);
    }
    function line(x1,y1,x2,y2,opts){ chalkStroke([{x:x1,y:y1},{x:x2,y:y2}],opts); }
    function circle(cx,cy,r,opts={}){
      const pts=[]; for(let i=0;i<=28;i++){ const t=(i/28)*Math.PI*2; pts.push({x:cx+Math.cos(t)*r,y:cy+Math.sin(t)*r}); }
      chalkStroke(pts,opts);
    }
    function roundRect(x,y,w,h,opts){ chalkStroke([{x,y},{x:x+w,y},{x:x+w,y:y+h},{x,y:y+h},{x,y}],opts); }
    function text(str,x,y,size=40,color="rgba(244,247,251,0.96)",align="center",weight="700"){
      ctx.save(); ctx.fillStyle=color;
      ctx.font=`${weight} ${size}px "PingFang SC","Noto Sans SC",sans-serif`;
      ctx.textAlign=align; ctx.textBaseline="middle";
      ctx.fillText(str, x+wobble(0.4), y+wobble(0.4)); ctx.restore();
    }
    function wrapText(str,x,y,maxWidth,size=34,color="rgba(244,247,251,0.95)",lineH=1.35){
      ctx.save(); ctx.fillStyle=color;
      ctx.font=`600 ${size}px "PingFang SC","Noto Sans SC",sans-serif`;
      ctx.textAlign="center"; ctx.textBaseline="middle";
      const chars=[...str]; let cur=""; const lines=[];
      for(const ch of chars){
        const test=cur+ch;
        if(ctx.measureText(test).width>maxWidth && cur){ lines.push(cur); cur=ch; } else cur=test;
      }
      if(cur) lines.push(cur);
      const totalH=(lines.length-1)*size*lineH;
      lines.forEach((ln,i)=> ctx.fillText(ln, x, y-totalH/2+i*size*lineH));
      ctx.restore(); return lines.length;
    }
    function ground(y=CONTENT_BOTTOM+10){
      const pts=[]; for(let x=70;x<W-70;x+=34) pts.push({x, y:y+Math.sin(x*0.016)*9});
      chalkStroke(pts,{width:2.8,alpha:0.8});
    }
    function stars(t,n=50){
      seed=77;
      for(let i=0;i<n;i++){
        const x=rand()*W, y=SAFE_TOP+rand()*(CONTENT_BOTTOM-SAFE_TOP)*0.5;
        const a=0.2+0.55*(0.5+0.5*Math.sin(t*0.004+i*1.7));
        ctx.fillStyle=`rgba(244,247,251,${a})`; ctx.fillRect(x,y,2.2,2.2);
      }
    }
    function drawFrog(x,y,scale=1,mood="idle",t=0){
      const s=scale, bounce=Math.sin(t*0.006)*4*s, cy=y+bounce;
      circle(x,cy,46*s,{width:3.4,color:"rgba(141,255,156,0.95)"});
      circle(x-20*s,cy-30*s,15*s,{width:2.8}); circle(x+20*s,cy-30*s,15*s,{width:2.8});
      ctx.save(); ctx.fillStyle="#071018";
      const look=mood==="lookUp"?-3:mood==="think"?2:0;
      ctx.beginPath();
      ctx.arc(x-20*s,cy-30*s+look,5*s,0,Math.PI*2);
      ctx.arc(x+20*s,cy-30*s+look,5*s,0,Math.PI*2);
      ctx.fill(); ctx.restore();
      if(mood==="talk"){
        const open=5+Math.abs(Math.sin(t*0.025))*7;
        chalkStroke([{x:x-14*s,y:cy+10*s},{x:x,y:cy+10*s+open},{x:x+14*s,y:cy+10*s}],{width:2.6});
      } else {
        chalkStroke([{x:x-14*s,y:cy+12*s},{x:x,y:cy+20*s},{x:x+14*s,y:cy+12*s}],{width:2.6});
      }
      chalkStroke([{x:x-22*s,y:cy+34*s},{x:x-42*s,y:cy+60*s},{x:x-16*s,y:cy+56*s}],{width:3.2,color:"rgba(141,255,156,0.9)"});
      chalkStroke([{x:x+22*s,y:cy+34*s},{x:x+42*s,y:cy+60*s},{x:x+16*s,y:cy+56*s}],{width:3.2,color:"rgba(141,255,156,0.9)"});
      text("呱基", x, cy+84*s, 26*Math.min(1.15,s), "rgba(141,255,156,0.95)");
    }
    function phone(x,y,offline=false){
      roundRect(x-55,y-95,110,190,{width:3});
      roundRect(x-42,y-75,84,135,{width:2,color:"rgba(154,215,255,0.35)"});
      if(offline){
        // wifi slash
        chalkStroke([{x:x-28,y:y-10},{x:x+28,y:y+20}],{width:4,color:"rgba(255,213,154,0.95)"});
        circle(x,y+8,22,{width:2.5,color:"rgba(255,213,154,0.7)"});
        text("没网？", x, y+130, 32, "rgba(255,213,154,0.95)");
      } else {
        text("AI", x, y, 40, "rgba(141,255,156,0.95)");
      }
    }
    function chip(x,y,label,t){
      roundRect(x-70,y-70,140,140,{width:3,color:"rgba(154,215,255,0.9)"});
      // pins
      for(let i=0;i<5;i++){
        line(x-70, y-40+i*20, x-90, y-40+i*20, {width:2.5,color:"rgba(154,215,255,0.7)"});
        line(x+70, y-40+i*20, x+90, y-40+i*20, {width:2.5,color:"rgba(154,215,255,0.7)"});
      }
      const pulse=0.5+0.5*Math.sin(t*0.01);
      circle(x,y,18,{width:2.5,color:"rgba(141,255,156,0.95)",alpha:0.6+0.4*pulse});
      text(label, x, y+100, 30, "rgba(168,184,204,0.95)");
    }
    function serverRack(x,y,t){
      roundRect(x-90,y-140,180,280,{width:3});
      for(let i=0;i<5;i++){
        roundRect(x-70,y-110+i*48,140,36,{width:2,color:"rgba(154,215,255,0.55)"});
        const on=Math.sin(t*0.008+i)>0;
        circle(x+50, y-92+i*48, 5, {width:2, color: on?"rgba(141,255,156,0.95)":"rgba(255,213,154,0.7)"});
      }
    }
    function titleBig(str,y=SAFE_TOP+36,color="rgba(154,215,255,0.98)"){ text(str,W/2,y,66,color); }
    function drawSubtitle(sc, localT){
      const bandTop = H - SAFE_BOTTOM - SUB_H;
      const g=ctx.createLinearGradient(0, bandTop-50, 0, H - SAFE_BOTTOM);
      g.addColorStop(0,"rgba(7,16,24,0)"); g.addColorStop(0.28,"rgba(7,16,24,0.8)"); g.addColorStop(1,"rgba(7,16,24,0.92)");
      ctx.fillStyle=g; ctx.fillRect(0, bandTop-50, W, H - SAFE_BOTTOM - (bandTop-50));
      const full=sc.zh;
      const chars=Math.min(full.length, Math.floor(easeOut(localT/1600)*full.length)+1);
      wrapText(full.slice(0,Math.max(1,chars)), W/2, bandTop+SUB_H*0.38, 900, 40, "rgba(244,247,251,0.98)", 1.34);
      text(sc.tag, W/2, bandTop+SUB_H*0.72, 24, "rgba(154,215,255,0.88)");
    }

    function drawScene(index, localT, totalT){
      clear(); seed=900+index*83+Math.floor(localT/70);
      stars(totalT); ground();
      const p=clamp01(localT/Math.max(1, SCENES[index].duration-400));
      switch(SCENES[index].id){
        case "hook": drawHook(p,totalT); break;
        case "two": drawTwo(p,totalT); break;
        case "edge": drawEdge(p,totalT); break;
        case "cloud": drawCloud(p,totalT); break;
        case "edgepc": drawEdgePC(p,totalT); break;
        case "cloudpc": drawCloudPC(p,totalT); break;
        case "end": drawEnd(p,totalT); break;
      }
      drawSubtitle(SCENES[index], localT);
      const fade=clamp01(localT/280);
      if(fade<1){ ctx.fillStyle=`rgba(7,16,24,${1-fade})`; ctx.fillRect(0,0,W,H); }
    }

    function drawHook(p,t){
      titleBig("没网，AI 还能用？");
      drawFrog(W/2, 460, 1.25, "talk", t);
      if(p>0.2) phone(W*0.28, 900, true);
      if(p>0.4) phone(W*0.72, 900, false);
      if(p>0.65) wrapText("关键看：哪种 AI", W/2, 1180, 900, 44, "rgba(255,213,154,0.98)");
    }

    function drawTwo(p,t){
      titleBig("两种 AI");
      drawFrog(W/2, 380, 0.9, "idle", t);
      const a1=easeOut((p-0.1)/0.35);
      if(a1>0){
        ctx.save(); ctx.globalAlpha=a1;
        roundRect(90, 520, 400, 320, {width:3.2, color:"rgba(141,255,156,0.9)"});
        text("端侧", W*0.28, 600, 56, "rgba(141,255,156,0.98)");
        text("装在设备里", W*0.28, 680, 34);
        text("身边算", W*0.28, 750, 34, "rgba(168,184,204,0.95)");
        ctx.restore();
      }
      const a2=easeOut((p-0.4)/0.35);
      if(a2>0){
        ctx.save(); ctx.globalAlpha=a2;
        roundRect(590, 520, 400, 320, {width:3.2, color:"rgba(154,215,255,0.9)"});
        text("云端", W*0.72, 600, 56, "rgba(154,215,255,0.98)");
        text("算力中心", W*0.72, 680, 34);
        text("远方算", W*0.72, 750, 34, "rgba(168,184,204,0.95)");
        ctx.restore();
      }
      if(p>0.75) text("一个在身边 · 一个在远方", W/2, 960, 36, "rgba(255,213,154,0.95)");
    }

    function drawEdge(p,t){
      titleBig("端侧 = 装进设备");
      // phone with model pack downloading into it
      phone(W*0.28, 620, false);
      if(p>0.15){
        const y=480+Math.min(1,(p-0.15)/0.4)*200;
        roundRect(W*0.28-80, y-40, 160, 70, {width:2.5, color:"rgba(141,255,156,0.85)"});
        text("模型文件", W*0.28, y, 28, "rgba(141,255,156,0.95)");
        if(p>0.35) line(W*0.28, y+40, W*0.28, 520, {width:3, color:"rgba(141,255,156,0.7)"});
      }
      if(p>0.45){
        text("靠本机芯片算力", W*0.72, 480, 34, "rgba(154,215,255,0.95)");
        chip(W*0.72, 680, "CPU / GPU / NPU", t);
      }
      if(p>0.75) wrapText("算力在口袋里 → 可不依赖网络", W/2, 1080, 920, 40, "rgba(255,213,154,0.98)");
      drawFrog(W*0.18, 1000, 0.75, "think", t);
    }

    function drawCloud(p,t){
      titleBig("云端 = 远程算力中心");
      phone(W*0.22, 560, false);
      // dashed network path
      if(p>0.2){
        const mid=W*0.48;
        chalkStroke([
          {x:W*0.22+60,y:560},{x:mid,y:480},{x:W*0.72-100,y:560}
        ],{width:3,color:"rgba(154,215,255,0.85)",alpha:0.9});
        // packets
        for(let i=0;i<4;i++){
          const u=((t*0.001+i*0.2)%1);
          const x=W*0.28+u*(W*0.4);
          const y=560-Math.sin(u*Math.PI)*80;
          circle(x,y,6,{width:2,color:"rgba(141,255,156,0.9)"});
        }
        text("网络", mid, 420, 30, "rgba(168,184,204,0.95)");
      }
      if(p>0.4){
        serverRack(W*0.78, 700, t);
        text("算力中心", W*0.78, 920, 32, "rgba(154,215,255,0.95)");
      }
      if(p>0.75) wrapText("没网 → 这条路就断了", W/2, 1100, 900, 44, "rgba(255,213,154,0.98)");
    }

    function drawEdgePC(p,t){
      titleBig("端侧：好处与代价");
      drawFrog(W*0.86, SAFE_TOP+110, 0.65, "idle", t);
      const goods=["能离线使用","数据更留在本机","本地往往更跟手"];
      const bads=["能力通常更有限","占存储空间","比较费电"];
      goods.forEach((g,i)=>{
        if(p<0.1+i*0.1) return;
        const y=420+i*110;
        roundRect(80,y-45,920,90,{width:2.6,color:"rgba(141,255,156,0.55)"});
        text("＋  "+g, 120, y, 38, "rgba(141,255,156,0.98)", "left");
      });
      bads.forEach((b,i)=>{
        if(p<0.45+i*0.1) return;
        const y=780+i*110;
        roundRect(80,y-45,920,90,{width:2.6,color:"rgba(255,213,154,0.5)"});
        text("－  "+b, 120, y, 38, "rgba(255,213,154,0.98)", "left");
      });
    }

    function drawCloudPC(p,t){
      titleBig("云端：好处与代价");
      drawFrog(W*0.86, SAFE_TOP+110, 0.65, "idle", t);
      const goods=["模型更大更强","功能更新更快","重活更能扛"];
      const bads=["必须联网","内容经远端","高峰可能排队"];
      goods.forEach((g,i)=>{
        if(p<0.1+i*0.1) return;
        const y=420+i*110;
        roundRect(80,y-45,920,90,{width:2.6,color:"rgba(154,215,255,0.55)"});
        text("＋  "+g, 120, y, 38, "rgba(154,215,255,0.98)", "left");
      });
      bads.forEach((b,i)=>{
        if(p<0.45+i*0.1) return;
        const y=780+i*110;
        roundRect(80,y-45,920,90,{width:2.6,color:"rgba(255,213,154,0.5)"});
        text("－  "+b, 120, y, 38, "rgba(255,213,154,0.98)", "left");
      });
    }

    function drawEnd(p,t){
      titleBig("怎么选？");
      drawFrog(W/2, 400, 1.1, "talk", t);
      const a1=easeOut((p-0.15)/0.3);
      if(a1>0){
        ctx.save(); ctx.globalAlpha=a1;
        roundRect(90, 560, 900, 200, {width:3, color:"rgba(141,255,156,0.85)"});
        text("离线 / 隐私 / 秒回  →  端侧", W/2, 660, 40, "rgba(141,255,156,0.98)");
        ctx.restore();
      }
      const a2=easeOut((p-0.4)/0.3);
      if(a2>0){
        ctx.save(); ctx.globalAlpha=a2;
        roundRect(90, 800, 900, 200, {width:3, color:"rgba(154,215,255,0.85)"});
        text("重活 / 最新能力  →  云端", W/2, 900, 40, "rgba(154,215,255,0.98)");
        ctx.restore();
      }
      if(p>0.7) text("很多 App：端云协同", W/2, 1100, 36, "rgba(255,213,154,0.95)");
      if(p>0.85) text("下期见", W/2, 1180, 34, "rgba(141,255,156,0.95)");
    }

    function pickVoice(){
      const voices=speechSynthesis.getVoices();
      return voices.find(v=>/zh[-_]CN/i.test(v.lang))||voices.find(v=>/^zh/i.test(v.lang))||null;
    }
    function speak(textStr){
      if(muted||!("speechSynthesis" in window)) return;
      speechSynthesis.cancel();
      const u=new SpeechSynthesisUtterance(textStr);
      u.lang="zh-CN"; u.rate=1.06; u.pitch=1.15;
      const v=pickVoice(); if(v) u.voice=v;
      speechSynthesis.speak(u);
    }
    function stopSpeak(){ if("speechSynthesis" in window) speechSynthesis.cancel(); }

    function totalDuration(){ return SCENES.reduce((s,sc)=>s+sc.duration,0); }
    function sceneOffsets(){ const out=[]; let acc=0; SCENES.forEach(sc=>{out.push(acc);acc+=sc.duration;}); return out; }
    const offsets=sceneOffsets();

    function setScene(i, restartVoice=true){
      sceneIndex=Math.max(0,Math.min(SCENES.length-1,i));
      sceneStart=performance.now();
      const sc=SCENES[sceneIndex];
      meta.textContent=`场景 ${sceneIndex+1} / ${SCENES.length} · ${sc.title}`;
      [...sceneList.children].forEach((b,idx)=>b.classList.toggle("active", idx===sceneIndex));
      if(restartVoice && playing) speak(sc.voice);
      updateProgress(0);
    }
    function updateProgress(localT){
      bar.style.width=Math.min(100, ((offsets[sceneIndex]+localT)/totalDuration())*100)+"%";
    }
    function tick(now){
      if(!playing) return;
      const sc=SCENES[sceneIndex];
      const localT=now-sceneStart;
      drawScene(sceneIndex, localT, now);
      updateProgress(localT);
      if(localT>=sc.duration){
        if(sceneIndex<SCENES.length-1) setScene(sceneIndex+1,true);
        else {
          playing=false; btnPlay.textContent="再看一遍"; stopSpeak();
          drawScene(sceneIndex, sc.duration, now); updateProgress(sc.duration); return;
        }
      }
      raf=requestAnimationFrame(tick);
    }
    function play(){ playing=true; btnPlay.textContent="暂停"; setScene(sceneIndex,true); cancelAnimationFrame(raf); raf=requestAnimationFrame(tick); }
    function pause(){ playing=false; btnPlay.textContent="继续"; stopSpeak(); cancelAnimationFrame(raf); }
    function restart(){ stopSpeak(); sceneIndex=0; playing=true; btnPlay.textContent="暂停"; setScene(0,true); cancelAnimationFrame(raf); raf=requestAnimationFrame(tick); }

    SCENES.forEach((sc,i)=>{
      const b=document.createElement("button"); b.type="button"; b.textContent=`${i+1}. ${sc.title}`;
      b.addEventListener("click",()=>{
        const was=playing; stopSpeak(); setScene(i,was); drawScene(i,0,performance.now());
        if(was){ cancelAnimationFrame(raf); raf=requestAnimationFrame(tick); }
      });
      sceneList.appendChild(b);
    });
    btnPlay.addEventListener("click",()=>{ if(playing) pause(); else { if(btnPlay.textContent==="再看一遍") restart(); else play(); }});
    btnRestart.addEventListener("click", restart);
    btnMute.addEventListener("click",()=>{
      muted=!muted; btnMute.textContent=muted?"配音：关":"配音：开";
      if(muted) stopSpeak(); else if(playing) speak(SCENES[sceneIndex].voice);
    });

    window.__GUAJI__={
      SCENES, drawScene, setScene, totalDuration,
      get playing(){return playing;},
      setMuted(v){muted=v;},
      jump(i, localT){
        sceneIndex=i; const sc=SCENES[i];
        meta.textContent=`场景 ${i+1} / ${SCENES.length} · ${sc.title}`;
        [...sceneList.children].forEach((b,idx)=>b.classList.toggle("active", idx===i));
        drawScene(i, localT, performance.now());
        bar.style.width=Math.min(100, ((offsets[i]+localT)/totalDuration())*100)+"%";
      }
    };
    setScene(0,false);
    drawScene(0,800,performance.now());
  </script>
</body>
</html>
