        zh:"一句话：LLM 主攻文字，VLM 加上眼睛，Omni 往耳朵嘴巴再扩展。按场景选技能，比死记缩写更有用。我是呱基，我们下期见。",

    let playing=false, muted=false, sceneIndex=0, sceneStart=0, raf=0, activeBeats=null;

    function clamp01(t){ return Math.min(1, Math.max(0, t)); }
    function lerp(a,b,t){ return a+(b-a)*t; }
    function easeOutCubic(t){ t=clamp01(t); return 1-Math.pow(1-t,3); }
    function easeOutBack(t){ t=clamp01(t); const c1=1.35,c3=c1+1; return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2); }
    function hash(n){ n=Math.imul(n^0x9e3779b9,0x85ebca6b); n^=n>>>13; n=Math.imul(n,0xc2b2ae35); return ((n^(n>>>16))>>>0)/4294967296; }
    function wob(id,i,amp=1.5){ return (hash(id*97+i*13)-0.5)*amp; }

    function beatAt(key){
      const b=(activeBeats||[]).find(x=>x.key===key);
      return b?b.at:Infinity;
    }
    // 从口播该句开始后淡入；未说到则为 0
    function onBeat(localT, key, dur=480){
      return easeOutCubic((localT - beatAt(key))/dur);
    }
    function onBeatBack(localT, key, dur=520){
      return easeOutBack((localT - beatAt(key))/dur);
    }
    // 列表项：在 apps 句内按顺序错落出现
    function onList(localT, key, index, count, span){
      const start=beatAt(key);
      const step=span/Math.max(1,count);
      return easeOutCubic((localT - (start + index*step))/420);
    }

    function clear(){
      ctx.fillStyle="#071018"; ctx.fillRect(0,0,W,H);
      const g=ctx.createRadialGradient(W/2,H*0.4,80,W/2,H*0.5,1050);
      g.addColorStop(0,"rgba(22,44,64,0.32)"); g.addColorStop(1,"rgba(7,16,24,0)");
      ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
      for(let i=0;i<140;i++){
        ctx.fillStyle=`rgba(255,255,255,${0.018+hash(i*5)*0.035})`;
        ctx.fillRect(hash(i*3)*W, hash(i*7+1)*H, 1.5, 1.5);
      }
    }
    function chalkStroke(points, opts={}){
      const {color="rgba(244,247,251,0.94)", width=3.1, alpha=1, id=1, progress=1}=opts;
      if(points.length<2) return;
      const n=Math.max(2, Math.floor((points.length-1)*clamp01(progress))+1);
      const pts=points.slice(0,n);
      const stroke=(amp,wMul,aMul)=>{
        ctx.save(); ctx.globalAlpha=alpha*aMul;
        ctx.strokeStyle=color; ctx.lineWidth=width*wMul; ctx.lineCap="round"; ctx.lineJoin="round";
        ctx.beginPath();
        ctx.moveTo(pts[0].x+wob(id,0,amp), pts[0].y+wob(id,1,amp));
        for(let i=1;i<pts.length;i++){
          const p=pts[i], prev=pts[i-1];
          ctx.quadraticCurveTo(
            prev.x+wob(id,i*3,amp*0.45), prev.y+wob(id,i*4,amp*0.45),
            (prev.x+p.x)/2+wob(id,i*2,amp*0.65), (prev.y+p.y)/2+wob(id,i*2+1,amp*0.65)
          );
        }
        ctx.stroke(); ctx.restore();
      };
      stroke(1.7,1,1); stroke(2.6,1.55,0.16); stroke(1.0,0.62,0.26);
    }
    function line(x1,y1,x2,y2,o={}){ chalkStroke([{x:x1,y:y1},{x:x2,y:y2}],{...o,id:o.id||((x1*13+y1*7)|0)}); }
    function circle(cx,cy,r,o={}){
      const pts=[], segs=40;
      for(let i=0;i<=segs;i++){ const t=i/segs*Math.PI*2; pts.push({x:cx+Math.cos(t)*r,y:cy+Math.sin(t)*r}); }
      chalkStroke(pts,{...o,id:o.id||((cx*11+cy)|0)});
    }
    function roundRect(x,y,w,h,o={}){
      chalkStroke([{x,y},{x:x+w,y},{x:x+w,y:y+h},{x,y:y+h},{x,y}],{...o,id:o.id||((x*5+y*9)|0)});
    }
    function hatch(x,y,w,h,color,a=0.12,step=14){
      ctx.save(); ctx.globalAlpha=a; ctx.strokeStyle=color; ctx.lineWidth=1.4;
      for(let i=-h;i<w+h;i+=step){
        ctx.beginPath(); ctx.moveTo(x+i,y); ctx.lineTo(x+i+h,y+h); ctx.stroke();
      }
      ctx.restore();
    }
    function text(str,x,y,size=40,color="rgba(244,247,251,0.96)",align="center",alpha=1){
      ctx.save(); ctx.globalAlpha=clamp01(alpha); ctx.fillStyle=color;
      ctx.font=`700 ${size}px "PingFang SC","Noto Sans SC",sans-serif`;
      ctx.textAlign=align; ctx.textBaseline="middle"; ctx.fillText(str,x,y); ctx.restore();
    }
    function wrapText(str,x,y,maxWidth,size=34,color="rgba(244,247,251,0.95)",lineH=1.35,alpha=1){
      ctx.save(); ctx.globalAlpha=clamp01(alpha); ctx.fillStyle=color;
      ctx.font=`600 ${size}px "PingFang SC","Noto Sans SC",sans-serif`;
      ctx.textAlign="center"; ctx.textBaseline="middle";
      const chars=[...str]; let cur=""; const lines=[];
      for(const ch of chars){
        const test=cur+ch;
        if(ctx.measureText(test).width>maxWidth && cur){ lines.push(cur); cur=ch; } else cur=test;
      }
      if(cur) lines.push(cur);
      const totalH=(lines.length-1)*size*lineH;
      lines.forEach((ln,i)=>ctx.fillText(ln,x,y-totalH/2+i*size*lineH));
      ctx.restore();
    }
    function withA(a, fn){ if(a<=0) return; ctx.save(); ctx.globalAlpha=clamp01(a); fn(); ctx.restore(); }
    function withLift(a, dy, fn){
      if(a<=0) return;
      ctx.save(); ctx.globalAlpha=clamp01(a); ctx.translate(0, dy*(1-clamp01(a))); fn(); ctx.restore();
    }
    function softGlow(x,y,r,rgb,a=0.16){
      const g=ctx.createRadialGradient(x,y,2,x,y,r);
      g.addColorStop(0,`rgba(${rgb},${a})`); g.addColorStop(1,"rgba(0,0,0,0)");
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
    }
    function ground(t){
      const pts=[], y0=CONTENT_BOTTOM+6;
      for(let x=70;x<W-70;x+=26) pts.push({x,y:y0+Math.sin(x*0.016+t*0.001)*2.5});
      chalkStroke(pts,{width:2.4,alpha:0.7,id:42});
    }
    function stars(t){
      for(let i=0;i<36;i++){
        const x=hash(i*19)*W, y=SAFE_TOP+hash(i*23+1)*(CONTENT_BOTTOM-SAFE_TOP)*0.42;
        const tw=0.2+0.4*(0.5+0.5*Math.sin(t*0.003+i));
        ctx.fillStyle=`rgba(244,247,251,${tw*0.5})`;
        ctx.beginPath(); ctx.arc(x,y,1.1+hash(i)*1.1,0,Math.PI*2); ctx.fill();
      }
    }

    function chalkDust(x,y,a,t,id=50){
      if(a<=0) return;
      for(let i=0;i<10;i++){
        const ang=hash(id+i)*Math.PI*2, r=(8+hash(id+i*3)*22)*a;
        const px=x+Math.cos(ang+t*0.001)*r, py=y+Math.sin(ang+t*0.001)*r;
        ctx.fillStyle=`rgba(244,247,251,${0.18*a*(1-hash(id+i+1)*0.5)})`;
        ctx.fillRect(px,py,1.8,1.8);
      }
    }
    function boardPanel(x,y,w,h,a,id=60){
      if(a<=0) return;
      withA(a*0.9,()=>{
        roundRect(x,y,w,h,{width:2.2,color:"rgba(244,247,251,0.22)",id,progress:a});
        // corner ticks
        line(x+10,y+10,x+34,y+10,{width:1.6,color:"rgba(154,215,255,0.35)",id:id+1});
        line(x+10,y+10,x+10,y+34,{width:1.6,color:"rgba(154,215,255,0.35)",id:id+2});
        line(x+w-10,y+h-10,x+w-34,y+h-10,{width:1.6,color:"rgba(154,215,255,0.35)",id:id+3});
        line(x+w-10,y+h-10,x+w-10,y+h-34,{width:1.6,color:"rgba(154,215,255,0.35)",id:id+4});
      });
    }

    // ---- doodle icons (richer chalk) ----
    function iconBook(x,y,s,a,id=1000){
      withA(a,()=>{
        // open book
        chalkStroke([{x:x,y:y-48*s},{x:x-52*s,y:y-40*s},{x:x-48*s,y:y+42*s},{x:x,y:y+34*s},{x:x,y:y-48*s}],{width:2.6,color:"rgba(141,255,156,0.95)",id,progress:a});
        chalkStroke([{x:x,y:y-48*s},{x:x+52*s,y:y-40*s},{x:x+48*s,y:y+42*s},{x:x,y:y+34*s}],{width:2.6,color:"rgba(141,255,156,0.95)",id:id+1,progress:a});
        for(let i=0;i<4;i++){
          line(x-40*s,y-22*s+i*16*s,x-8*s,y-18*s+i*16*s,{width:1.6,color:"rgba(244,247,251,0.5)",id:id+2+i});
          line(x+8*s,y-18*s+i*16*s,x+40*s,y-22*s+i*16*s,{width:1.6,color:"rgba(244,247,251,0.5)",id:id+6+i});
        }
      });
    }
    function iconBubble(x,y,s,a,id=1100){
      withA(a,()=>{
        chalkStroke([
          {x:x-54*s,y:y-32*s},{x:x+46*s,y:y-32*s},{x:x+56*s,y:y},{x:x+46*s,y:y+32*s},
          {x:x-18*s,y:y+32*s},{x:x-40*s,y:y+54*s},{x:x-26*s,y:y+32*s},{x:x-54*s,y:y-32*s}
        ],{width:2.7,color:"rgba(154,215,255,0.95)",id,progress:a});
        line(x-28*s,y-8*s,x+24*s,y-8*s,{width:1.9,id:id+1});
        line(x-28*s,y+8*s,x+12*s,y+8*s,{width:1.9,id:id+2});
        line(x-28*s,y+22*s,x+2*s,y+22*s,{width:1.7,color:"rgba(244,247,251,0.45)",id:id+3});
      });
    }
    function iconEye(x,y,s,a,id=1200){
      withA(a,()=>{
        chalkStroke([
          {x:x-52*s,y:y},{x:x-22*s,y:y-30*s},{x:x+22*s,y:y-30*s},{x:x+52*s,y:y},

        circle(x-20*s,cy-34*s,16*s,{width:2.7,id:102});

    function drawSubtitle(sc, localT){
      const bandTop=H-SAFE_BOTTOM-SUB_H;
      const g=ctx.createLinearGradient(0,bandTop-50,0,H-SAFE_BOTTOM);
      g.addColorStop(0,"rgba(7,16,24,0)"); g.addColorStop(0.28,"rgba(7,16,24,0.82)"); g.addColorStop(1,"rgba(7,16,24,0.94)");
      ctx.fillStyle=g; ctx.fillRect(0,bandTop-50,W,H-SAFE_BOTTOM-(bandTop-50));

      // 字幕只显示已说到的分句累计
      let shown="";
      for(const b of sc.beats){
        if(localT < b.at) break;
        const nextAt = sc.beats.find(x=>x.at>b.at)?.at ?? sc.duration;
        const span=Math.max(1, nextAt-b.at);
        const frac=clamp01((localT-b.at)/(span*0.92));
        const n=Math.max(1, Math.floor(frac * b.text.length));
        shown += b.text.slice(0,n);
      }
      if(!shown) shown = sc.beats[0]?.text?.slice(0,1) || "";
      wrapText(shown, W/2, bandTop+SUB_H*0.36, 900, 38, "rgba(244,247,251,0.98)", 1.34, 1);
      text(sc.tag, W/2, bandTop+SUB_H*0.72, 24, "rgba(154,215,255,0.88)");
    }

      drawSubtitle(sc, localT);
    }

        hatch(150,710,780,100,"255,213,154",0.07);
        text("→ 文字解释 / 要点", W/2, 760, 36, "rgba(255,213,154,0.98)");
      });

      const apps=[
        {n:"识图答题", draw:iconEye},
        {n:"读表读票", draw:iconTable},
        {n:"看设计稿", draw:iconCamera},
        {n:"整理白板", draw:iconBoard},
      ];
      apps.forEach((ap,i)=>{
        const a=onList(localT,"apps",i,apps.length, 5600);
        if(a<=0) return;
        const x=160+(i%2)*420, y=880+Math.floor(i/2)*120;
        withLift(a, 16, ()=>{
          ap.draw(x, y, 0.55, a, 2800+i*10);
          text(ap.n, x+90, y, 30, "rgba(244,247,251,0.95)", "left");
        });
      });
    }

    function drawOmni(localT,t){
      titleBig("Omni · 全能感官", onBeat(localT,"title",450));
      drawFrog(W/2, 400, 0.95, "talk", t, onBeat(localT,"title",400));

      // 听、说、看、写 — 跟 goal 句内顺序出现
      const senses=[
        {l:"听", c:"255,213,154", draw:iconMic},
        {l:"说", c:"141,255,156", draw:iconSpeaker},
        {l:"看", c:"154,215,255", draw:iconEye},
        {l:"写", c:"244,247,251", draw:(x,y,s,a)=>iconBook(x,y,s,a,2900)},
      ];
      senses.forEach((s,i)=>{
        const a=onList(localT,"goal",i,senses.length, 3200);
        if(a<=0) return;
        const x=140+i*220, y=620;
        withLift(a, 22, ()=>{
          softGlow(x,y,70,s.c,0.12);
          circle(x,y,62,{width:2.8,color:`rgba(${s.c},0.95)`,id:3000+i,progress:a});
          s.draw(x,y,0.72,a,3010+i*10);
          text(s.l, x, y+95, 30, `rgba(${s.c},0.95)`);
        });
      });

      const aVoice=onBeatBack(localT,"voice",520);
      withLift(aVoice, 18, ()=>{
        roundRect(90, 780, 420, 100, {width:2.5, color:"rgba(255,213,154,0.85)", id:3100, progress:aVoice});
        text("语音提问 → 口头回答", 300, 830, 28, "rgba(255,213,154,0.98)");
      });

      const aWatch=onBeatBack(localT,"watch",520);
      withLift(aWatch, 18, ()=>{
        roundRect(560, 780, 430, 100, {width:2.5, color:"rgba(154,215,255,0.85)", id:3110, progress:aWatch});
        text("边看画面边解说", 775, 830, 28, "rgba(154,215,255,0.98)");
      });

      ["免打字对话","口语陪练","现场讲解"].forEach((name,i)=>{
        const a=onList(localT,"apps",i,3, 3400);
        if(a<=0) return;
        withLift(a, 14, ()=>{
          roundRect(120, 930+i*85, 840, 70, {width:2.4, color:"rgba(255,213,154,0.55)", id:3200+i, progress:a});
          text(name, W/2, 965+i*85, 32, "rgba(244,247,251,0.98)");
        });
      });
    }

    function drawPick(localT,t){
      titleBig("按任务选技能", onBeat(localT,"title",450));
      drawFrog(W*0.88, SAFE_TOP+118, 0.55, "idle", t, onBeat(localT,"title",400));

      const rows=[
        {key:"llm", q:"纯文字任务", a:"→ LLM", c:"141,255,156", draw:iconBook},
        {key:"vlm", q:"图片 / 截图 / 扫描件", a:"→ VLM", c:"154,215,255", draw:iconEye},
        {key:"omni", q:"语音连聊、少动手", a:"→ Omni", c:"255,213,154", draw:iconMic},
      ];
      rows.forEach((r,i)=>{
        const a=onBeatBack(localT,r.key,600);
        if(a<=0) return;
        const y=430+i*200;
        withLift(a, 28, ()=>{
          softGlow(W/2, y+75, 250, r.c, 0.08);
          roundRect(80, y, 920, 150, {width:3, color:`rgba(${r.c},0.95)`, id:3300+i, progress:a});
          hatch(90,y+8,900,134,r.c,0.06);
          r.draw(170, y+75, 0.85, a, 3310+i*10);
          text(r.q, 280, y+75, 34, "rgba(244,247,251,0.96)", "left");
          text(r.a, 860, y+75, 42, `rgba(${r.c},0.98)`);
        });
      });

      const aTip=onBeat(localT,"tip",500);
      withLift(aTip,12,()=> text("名字不重要，先看输入输出够不够用", W/2, 1120, 30, "rgba(168,184,204,0.95)"));
    }

    function drawEnd(localT,t){
      titleBig("记住这一句", onBeat(localT,"title",450));

      const lines=[
        {key:"llm", t:"LLM  ·  主攻文字", c:"141,255,156", draw:iconBook},
        {key:"vlm", t:"VLM  ·  加上眼睛", c:"154,215,255", draw:iconEye},
        {key:"omni", t:"Omni ·  耳朵嘴巴再扩展", c:"255,213,154", draw:iconMic},
      ];
      lines.forEach((ln,i)=>{
        const a=onBeatBack(localT,ln.key,560);
        if(a<=0) return;
        const y=400+i*155;
        withLift(a, 24, ()=>{
          roundRect(90, y, 900, 125, {width:2.8, color:`rgba(${ln.c},0.95)`, id:3400+i, progress:a});
          ln.draw(180, y+62, 0.7, a, 3410+i*10);
          text(ln.t, 580, y+62, 36, `rgba(${ln.c},0.98)`);
        });
      });

      const aTip=onBeat(localT,"tip",480);
      withLift(aTip,12,()=> text("按场景选技能，比死记缩写更有用", W/2, 920, 30, "rgba(244,247,251,0.92)"));

      const aBye=onBeat(localT,"bye",520);
      withLift(aBye, 16, ()=>{
        drawFrog(W/2, 1040, 0.85, "talk", t, 1);
        text("我是呱基，我们下期见", W/2, 1170, 32, "rgba(141,255,156,0.98)");
      });
    }

    // ---- playback ----
    function pickVoice(){
      const v=speechSynthesis.getVoices();
      return v.find(x=>/zh[-_]CN/i.test(x.lang))||v.find(x=>/^zh/i.test(x.lang))||null;
    }
    function speak(s){
      if(muted||!("speechSynthesis"in window)) return;
      speechSynthesis.cancel();
      const u=new SpeechSynthesisUtterance(s); u.lang="zh-CN"; u.rate=1.06; u.pitch=1.15;
      const v=pickVoice(); if(v) u.voice=v; speechSynthesis.speak(u);
    }
    function stopSpeak(){ if("speechSynthesis"in window) speechSynthesis.cancel(); }
    function totalDuration(){ return SCENES.reduce((s,sc)=>s+sc.duration,0); }
    function sceneOffsets(){ const o=[]; let a=0; SCENES.forEach(sc=>{o.push(a);a+=sc.duration}); return o; }
    const offsets=sceneOffsets();

    function setScene(i, rv=true){
      sceneIndex=Math.max(0,Math.min(SCENES.length-1,i));
      sceneStart=performance.now();
      const sc=SCENES[sceneIndex];
      activeBeats=sc.beats;
      meta.textContent=`场景 ${sceneIndex+1} / ${SCENES.length} · ${sc.title}`;
      [...sceneList.children].forEach((b,idx)=>b.classList.toggle("active",idx===sceneIndex));
      if(rv&&playing) speak(sc.voice);
      updateProgress(0);
    }
    function updateProgress(localT){
      bar.style.width=Math.min(100, ((offsets[sceneIndex]+localT)/totalDuration())*100)+"%";
    }
    function tick(now){
      if(!playing) return;
      const sc=SCENES[sceneIndex];
      const localT=now-sceneStart;
      drawScene(sceneIndex, localT, now);
      updateProgress(localT);
      if(localT>=sc.duration){
        if(sceneIndex<SCENES.length-1) setScene(sceneIndex+1,true);
        else {
          playing=false; btnPlay.textContent="再看一遍"; stopSpeak();
          drawScene(sceneIndex, sc.duration, now); updateProgress(sc.duration); return;
        }
      }
      raf=requestAnimationFrame(tick);
    }
    function play(){ playing=true; btnPlay.textContent="暂停"; setScene(sceneIndex,true); cancelAnimationFrame(raf); raf=requestAnimationFrame(tick); }
    function pause(){ playing=false; btnPlay.textContent="继续"; stopSpeak(); cancelAnimationFrame(raf); }
    function restart(){ stopSpeak(); sceneIndex=0; playing=true; btnPlay.textContent="暂停"; setScene(0,true); cancelAnimationFrame(raf); raf=requestAnimationFrame(tick); }

    SCENES.forEach((sc,i)=>{
      const b=document.createElement("button"); b.type="button"; b.textContent=`${i+1}. ${sc.title}`;
      b.addEventListener("click",()=>{
        const was=playing; stopSpeak(); setScene(i,was); drawScene(i,0,performance.now());
        if(was){ cancelAnimationFrame(raf); raf=requestAnimationFrame(tick); }
      });
      sceneList.appendChild(b);
    });
    btnPlay.addEventListener("click",()=>{ if(playing) pause(); else { if(btnPlay.textContent==="再看一遍") restart(); else play(); }});
    btnRestart.addEventListener("click", restart);
    btnMute.addEventListener("click",()=>{
      muted=!muted; btnMute.textContent=muted?"配音：关":"配音：开";
      if(muted) stopSpeak(); else if(playing) speak(SCENES[sceneIndex].voice);
    });

    window.__GUAJI__={
      SCENES, totalDuration,
      get playing(){return playing},
      setMuted(v){muted=v},
      drawAt(ms){
        let remain=ms, idx=0;
        while(idx<SCENES.length-1 && remain>=SCENES[idx].duration){ remain-=SCENES[idx].duration; idx++; }
        sceneIndex=idx; activeBeats=SCENES[idx].beats;
        meta.textContent=`场景 ${idx+1} / ${SCENES.length} · ${SCENES[idx].title}`;
        [...sceneList.children].forEach((b,j)=>b.classList.toggle("active", j===idx));
        drawScene(idx, remain, ms);
        bar.style.width=Math.min(100,(ms/totalDuration())*100)+"%";
      },
      jump(i, localT){ this.drawAt(offsets[i]+localT); }
    };
    setScene(0,false);
    // preview mid-hook (after chat beat) so stage isn't empty/full
    drawScene(0, 3000, performance.now());
  </script>
