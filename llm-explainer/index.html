<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>呱基讲 AI · 为什么大模型说话有快有慢</title>
  <style>
    :root {
      --bg: #0a1a12;
      --ink: #f3faf4;
      --mute: #a8c4b0;
      --accent: #7dffa3;
      --frog: #6fdc7a;
      --panel: #102418;
      --line: rgba(243, 250, 244, 0.14);
      --warn: #ffd28a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      min-height: 100%;
      background:
        radial-gradient(700px 500px at 50% -5%, #163525 0%, transparent 55%),
        var(--bg);
      color: var(--ink);
      font-family: "PingFang SC", "Noto Sans SC", "Hiragino Sans GB", sans-serif;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      padding: 16px 12px 28px;
    }
    .brand {
      width: min(420px, 100%);
      text-align: center;
    }
    .brand .host {
      color: var(--accent);
      font-size: 13px;
      letter-spacing: 0.08em;
      margin-bottom: 6px;
    }
    .brand h1 {
      font-family: "Songti SC", "Noto Serif SC", Georgia, serif;
      font-size: clamp(22px, 5.5vw, 28px);
      line-height: 1.25;
      font-weight: 700;
    }
    .brand p {
      margin-top: 8px;
      color: var(--mute);
      font-size: 13px;
      line-height: 1.55;
    }
    .stage-wrap {
      width: min(420px, 100%);
      position: relative;
      border: 1px solid var(--line);
      background: #07140e;
      overflow: hidden;
      aspect-ratio: 9 / 16;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: #07140e;
    }
    .subtitle {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      padding: 16px 14px 18px;
      text-align: center;
      background: linear-gradient(transparent, rgba(0,0,0,0.78));
      pointer-events: none;
    }
    .subtitle .zh {
      font-size: clamp(14px, 3.6vw, 17px);
      line-height: 1.45;
      font-weight: 500;
      text-shadow: 0 1px 8px rgba(0,0,0,0.85);
    }
    .subtitle .tag {
      margin-top: 6px;
      font-size: 12px;
      color: var(--accent);
      opacity: 0.9;
    }
    .progress {
      width: min(420px, 100%);
      height: 3px;
      background: rgba(255,255,255,0.08);
      overflow: hidden;
    }
    .progress > i {
      display: block;
      height: 100%;
      width: 0%;
      background: var(--accent);
    }
    .controls {
      width: min(420px, 100%);
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    button {
      appearance: none;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--ink);
      padding: 10px 14px;
      font-size: 13px;
      cursor: pointer;
    }
    button:hover { border-color: rgba(125,255,163,0.45); background: #163524; }
    button.primary {
      background: #1a4a2e;
      border-color: rgba(125,255,163,0.55);
    }
    .meta {
      color: var(--mute);
      font-size: 12px;
      margin-left: auto;
    }
    .scene-list {
      width: min(420px, 100%);
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }
    .scene-list button {
      text-align: left;
      padding: 8px 10px;
      font-size: 11px;
      color: var(--mute);
      line-height: 1.35;
    }
    .scene-list button.active {
      color: var(--ink);
      border-color: rgba(125,255,163,0.5);
      background: #163524;
    }
    .hint {
      width: min(420px, 100%);
      color: var(--mute);
      font-size: 11px;
      line-height: 1.5;
    }
    @media (max-width: 420px) {
      .meta { margin-left: 0; width: 100%; }
    }
  </style>
</head>
<body>
  <header class="brand">
    <div class="host">呱基 · AI 概念课</div>
    <h1>为什么大模型说话<br>有快有慢？</h1>
    <p>Prefill 读题 · Decode 吐字 · 少等待的五条干货。面向老师、传统行业与大学生等非 AI 从业者。</p>
  </header>

  <div class="stage-wrap">
    <canvas id="stage" width="1080" height="1920" aria-label="呱基竖屏科普画布"></canvas>
    <div class="subtitle">
      <div class="zh" id="subZh"></div>
      <div class="tag" id="subTag"></div>
    </div>
  </div>

  <div class="progress" aria-hidden="true"><i id="bar"></i></div>

  <div class="controls">
    <button class="primary" id="btnPlay">播放</button>
    <button id="btnRestart">重来</button>
    <button id="btnMute">配音：开</button>
    <div class="meta" id="meta">场景 1 / 7</div>
  </div>

  <div class="scene-list" id="sceneList"></div>
  <p class="hint">竖屏 9:16 · 正常语速 · 口播以「呱基」开头和结尾。旁白使用浏览器 SpeechSynthesis。</p>

  <script>
    const canvas = document.getElementById("stage");
    const ctx = canvas.getContext("2d");
    const subZh = document.getElementById("subZh");
    const subTag = document.getElementById("subTag");
    const bar = document.getElementById("bar");
    const meta = document.getElementById("meta");
    const btnPlay = document.getElementById("btnPlay");
    const btnRestart = document.getElementById("btnRestart");
    const btnMute = document.getElementById("btnMute");
    const sceneList = document.getElementById("sceneList");

    const W = canvas.width;
    const H = canvas.height;

    // ---- Script: 每段以「呱基」开头和结尾 ----
    const SCENES = [
      {
        id: "hook",
        title: "引出问题",
        tag: "常见疑问",
        zh: "呱基。你有没有发现：有时候大模型几乎秒回，有时候却转圈转半天？今天把原因讲清楚。呱基。",
        voice: "呱基。你有没有发现：有时候大模型几乎秒回，有时候却转圈转半天？今天把原因讲清楚。呱基。",
        duration: 12000,
      },
      {
        id: "two",
        title: "两段式",
        tag: "总览",
        zh: "呱基。大模型每次回答，其实分两段活：先「读题」，再「写字」。专业说法叫 Prefill 和 Decode。呱基。",
        voice: "呱基。大模型每次回答，其实分两段活：先读题，再写字。专业说法叫 Prefill 和 Decode。呱基。",
        duration: 12000,
      },
      {
        id: "prefill",
        title: "Prefill",
        tag: "原理 · 读题",
        zh: "呱基。Prefill，就像老师先把整道题一次性读完。你贴的提示词、文件、聊天记录越长，这一步越吃力，开头就越容易卡住。呱基。",
        voice: "呱基。Prefill，就像老师先把整道题一次性读完。你贴的提示词、文件、聊天记录越长，这一步越吃力，开头就越容易卡住。呱基。",
        duration: 14000,
      },
      {
        id: "decode",
        title: "Decode",
        tag: "原理 · 吐字",
        zh: "呱基。Decode，是真正「说话」：模型一个字一个字往外蹦。你要它写长文、写代码，字数越多，等的时间就越长。呱基。",
        voice: "呱基。Decode，是真正说话：模型一个字一个字往外蹦。你要它写长文、写代码，字数越多，等的时间就越长。呱基。",
        duration: 14000,
      },
      {
        id: "factors",
        title: "影响因素",
        tag: "拆解",
        zh: "呱基。速度还受这些影响：输入越长 Prefill 越慢；输出越长 Decode 越久；模型越大通常越慢；高峰排队也会拖时间。呱基。",
        voice: "呱基。速度还受这些影响：输入越长 Prefill 越慢；输出越长 Decode 越久；模型越大通常越慢；高峰排队也会拖时间。呱基。",
        duration: 14000,
      },
      {
        id: "tips",
        title: "实操干货",
        tag: "少等待",
        zh: "呱基。想少等待，记五条：少贴整份长文，先摘要再问；一次只问一个问题；写明「用三点回答」「一百字内」；长任务拆成多轮；日常聊天用轻量模型，重活再上大模型。呱基。",
        voice: "呱基。想少等待，记五条：少贴整份长文，先摘要再问；一次只问一个问题；写明用三点回答、一百字内；长任务拆成多轮；日常聊天用轻量模型，重活再上大模型。呱基。",
        duration: 16000,
      },
      {
        id: "end",
        title: "收尾",
        tag: "记住一句",
        zh: "呱基。一句话：卡住多半在读题，写得慢多半在吐字。会拆任务，就能少干等。我们下期见。呱基。",
        voice: "呱基。一句话：卡住多半在读题，写得慢多半在吐字。会拆任务，就能少干等。我们下期见。呱基。",
        duration: 10000,
      },
    ];

    let playing = false;
    let muted = false;
    let sceneIndex = 0;
    let sceneStart = 0;
    let raf = 0;
    let seed = 1;

    function rand() {
      seed = (seed * 16807) % 2147483647;
      return (seed - 1) / 2147483646;
    }
    function wobble(a = 1.4) {
      return (rand() - 0.5) * a;
    }

    function clear() {
      ctx.fillStyle = "#07140e";
      ctx.fillRect(0, 0, W, H);
      seed = 42;
      ctx.fillStyle = "rgba(255,255,255,0.03)";
      for (let i = 0; i < 160; i++) {
        ctx.fillRect(rand() * W, rand() * H, 2, 2);
      }
    }

    function chalkStroke(points, opts = {}) {
      const { color = "rgba(243,250,244,0.92)", width = 3, alpha = 1 } = opts;
      if (points.length < 2) return;
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.strokeStyle = color;
      ctx.lineWidth = width;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.beginPath();
      ctx.moveTo(points[0].x + wobble(), points[0].y + wobble());
      for (let i = 1; i < points.length; i++) {
        const p = points[i];
        const prev = points[i - 1];
        const mx = (prev.x + p.x) / 2 + wobble(0.9);
        const my = (prev.y + p.y) / 2 + wobble(0.9);
        ctx.quadraticCurveTo(prev.x + wobble(0.7), prev.y + wobble(0.7), mx, my);
      }
      const last = points[points.length - 1];
      ctx.lineTo(last.x, last.y);
      ctx.stroke();
      ctx.globalAlpha = alpha * 0.25;
      ctx.lineWidth = width * 1.7;
      ctx.stroke();
      ctx.restore();
    }

    function line(x1, y1, x2, y2, opts) {
      chalkStroke([{ x: x1, y: y1 }, { x: x2, y: y2 }], opts);
    }

    function circle(cx, cy, r, opts = {}) {
      const pts = [];
      const n = 26;
      for (let i = 0; i <= n; i++) {
        const t = (i / n) * Math.PI * 2;
        pts.push({ x: cx + Math.cos(t) * r, y: cy + Math.sin(t) * r });
      }
      chalkStroke(pts, opts);
    }

    function roundRect(x, y, w, h, opts) {
      chalkStroke([
        { x, y },
        { x: x + w, y },
        { x: x + w, y: y + h },
        { x, y: y + h },
        { x, y },
      ], opts);
    }

    function text(str, x, y, size = 36, color = "rgba(243,250,244,0.95)", align = "center") {
      ctx.save();
      ctx.fillStyle = color;
      ctx.font = `600 ${size}px "PingFang SC", "Noto Sans SC", sans-serif`;
      ctx.textAlign = align;
      ctx.textBaseline = "middle";
      ctx.fillText(str, x + wobble(0.5), y + wobble(0.5));
      ctx.restore();
    }

    function wrapText(str, x, y, maxWidth, size = 30, color = "rgba(243,250,244,0.92)", lineH = 1.35) {
      ctx.save();
      ctx.fillStyle = color;
      ctx.font = `500 ${size}px "PingFang SC", "Noto Sans SC", sans-serif`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      const chars = [...str];
      let lineStr = "";
      const lines = [];
      for (const ch of chars) {
        const test = lineStr + ch;
        if (ctx.measureText(test).width > maxWidth && lineStr) {
          lines.push(lineStr);
          lineStr = ch;
        } else {
          lineStr = test;
        }
      }
      if (lineStr) lines.push(lineStr);
      const totalH = (lines.length - 1) * size * lineH;
      lines.forEach((ln, i) => {
        ctx.fillText(ln, x, y - totalH / 2 + i * size * lineH);
      });
      ctx.restore();
      return lines.length;
    }

    /** 手绘小青蛙呱基 */
    function drawFrog(x, y, scale = 1, mood = "idle", t = 0) {
      const s = scale;
      const bounce = Math.sin(t * 0.005) * 3 * s;
      const cy = y + bounce;
      // body
      circle(x, cy, 42 * s, { width: 3.2, color: "rgba(111,220,122,0.95)" });
      circle(x, cy + 8 * s, 28 * s, { width: 2.2, color: "rgba(125,255,163,0.55)", alpha: 0.7 });
      // eyes
      circle(x - 18 * s, cy - 28 * s, 14 * s, { width: 2.6, color: "rgba(243,250,244,0.95)" });
      circle(x + 18 * s, cy - 28 * s, 14 * s, { width: 2.6, color: "rgba(243,250,244,0.95)" });
      ctx.save();
      ctx.fillStyle = "#0b1c12";
      const lookY = mood === "lookUp" ? -3 : mood === "think" ? 2 : 0;
      ctx.beginPath();
      ctx.arc(x - 18 * s, cy - 28 * s + lookY, 4.5 * s, 0, Math.PI * 2);
      ctx.arc(x + 18 * s, cy - 28 * s + lookY, 4.5 * s, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
      // smile / mouth
      if (mood === "talk") {
        const open = 4 + Math.abs(Math.sin(t * 0.02)) * 6;
        chalkStroke([
          { x: x - 12 * s, y: cy + 8 * s },
          { x: x, y: cy + 8 * s + open },
          { x: x + 12 * s, y: cy + 8 * s },
        ], { width: 2.4, color: "rgba(243,250,244,0.9)" });
      } else if (mood === "worry") {
        chalkStroke([
          { x: x - 12 * s, y: cy + 14 * s },
          { x: x, y: cy + 8 * s },
          { x: x + 12 * s, y: cy + 14 * s },
        ], { width: 2.4 });
      } else {
        chalkStroke([
          { x: x - 12 * s, y: cy + 10 * s },
          { x: x, y: cy + 16 * s },
          { x: x + 12 * s, y: cy + 10 * s },
        ], { width: 2.4 });
      }
      // legs
      chalkStroke([
        { x: x - 20 * s, y: cy + 30 * s },
        { x: x - 38 * s, y: cy + 55 * s },
        { x: x - 18 * s, y: cy + 52 * s },
      ], { width: 3, color: "rgba(111,220,122,0.9)" });
      chalkStroke([
        { x: x + 20 * s, y: cy + 30 * s },
        { x: x + 38 * s, y: cy + 55 * s },
        { x: x + 18 * s, y: cy + 52 * s },
      ], { width: 3, color: "rgba(111,220,122,0.9)" });
      // name tag
      text("呱基", x, cy + 78 * s, 22 * Math.min(1.2, scale), "rgba(125,255,163,0.95)");
    }

    function phone(x, y, label, spinning = false, t = 0) {
      roundRect(x - 55, y - 90, 110, 180, { width: 2.8 });
      roundRect(x - 42, y - 72, 84, 130, { width: 1.8, color: "rgba(125,255,163,0.35)" });
      text(label, x, y + 110, 26, "rgba(168,196,176,0.95)");
      if (spinning) {
        const a = t * 0.008;
        chalkStroke([
          { x: x + Math.cos(a) * 22, y: y + Math.sin(a) * 22 },
          { x: x + Math.cos(a + 2) * 22, y: y + Math.sin(a + 2) * 22 },
          { x: x + Math.cos(a + 4) * 22, y: y + Math.sin(a + 4) * 22 },
        ], { width: 3, color: "rgba(255,210,138,0.95)" });
      } else {
        text("✓", x, y, 48, "rgba(125,255,163,0.95)");
      }
    }

    function ground(y = H - 220) {
      const pts = [];
      for (let x = 60; x < W - 60; x += 36) {
        pts.push({ x, y: y + Math.sin(x * 0.015) * 8 });
      }
      chalkStroke(pts, { width: 2.6, alpha: 0.75 });
    }

    function titleBanner(str) {
      text(str, W / 2, 160, 44, "rgba(125,255,163,0.95)");
    }

    // ---- Scenes ----
    function drawScene(index, localT, totalT) {
      clear();
      seed = 800 + index * 91 + Math.floor(localT / 90);
      ground();
      const p = Math.min(1, localT / Math.max(1, SCENES[index].duration - 500));
      switch (SCENES[index].id) {
        case "hook": drawHook(p, totalT); break;
        case "two": drawTwo(p, totalT); break;
        case "prefill": drawPrefill(p, totalT); break;
        case "decode": drawDecode(p, totalT); break;
        case "factors": drawFactors(p, totalT); break;
        case "tips": drawTips(p, totalT); break;
        case "end": drawEnd(p, totalT); break;
      }
    }

    function drawHook(p, t) {
      titleBanner("秒回 vs 干等");
      drawFrog(W / 2, 420, 1.35, "lookUp", t);
      if (p > 0.2) phone(W * 0.28, 980, "秒回", false, t);
      if (p > 0.4) phone(W * 0.72, 980, "转圈中…", true, t);
      if (p > 0.7) {
        wrapText("同一类问题，为什么体验差这么多？", W / 2, 1280, 820, 32, "rgba(168,196,176,0.95)");
      }
    }

    function drawTwo(p, t) {
      titleBanner("回答 = 两段活");
      drawFrog(W / 2, 380, 1.1, "talk", t);

      // box 1
      if (p > 0.2) {
        roundRect(120, 620, 840, 220, { width: 3, color: "rgba(125,255,163,0.85)" });
        text("① Prefill · 读题", W / 2, 690, 40);
        text("先把你的问题整段读完", W / 2, 760, 28, "rgba(168,196,176,0.95)");
      }
      // arrow
      if (p > 0.45) {
        line(W / 2, 860, W / 2, 940, { width: 3.5, color: "rgba(125,255,163,0.9)" });
        line(W / 2, 940, W / 2 - 16, 920, { width: 3, color: "rgba(125,255,163,0.9)" });
        line(W / 2, 940, W / 2 + 16, 920, { width: 3, color: "rgba(125,255,163,0.9)" });
      }
      // box 2
      if (p > 0.55) {
        roundRect(120, 960, 840, 220, { width: 3, color: "rgba(255,210,138,0.85)" });
        text("② Decode · 写字", W / 2, 1030, 40, "rgba(255,210,138,0.95)");
        text("再一个字一个字往外说", W / 2, 1100, 28, "rgba(168,196,176,0.95)");
      }
      if (p > 0.8) {
        text("卡住 ≠ 坏了，多半在干其中一段", W / 2, 1300, 28, "rgba(168,196,176,0.9)");
      }
    }

    function drawPrefill(p, t) {
      titleBanner("Prefill = 先读题");
      // exam paper
      roundRect(160, 280, 760, 520, { width: 3 });
      text("你的提示词 / 文件 / 聊天记录", W / 2, 340, 28, "rgba(168,196,176,0.9)");
      for (let i = 0; i < 6; i++) {
        const w = 500 - i * 30;
        if (p > 0.15 + i * 0.08) {
          line(W / 2 - w / 2, 420 + i * 50, W / 2 + w / 2, 420 + i * 50, {
            width: 4,
            color: "rgba(125,255,163,0.55)",
          });
        }
      }
      // arrow into brain
      if (p > 0.55) {
        line(W / 2, 820, W / 2, 900, { width: 3, color: "rgba(125,255,163,0.9)" });
        text("一次性读完（不是边读边写）", W / 2, 870, 26, "rgba(125,255,163,0.95)");
      }
      drawFrog(W / 2, 1080, 1.25, "think", t);
      if (p > 0.7) {
        wrapText("输入越长 → 开头等待越明显（首字更慢）", W / 2, 1320, 860, 30, "rgba(255,210,138,0.95)");
      }
    }

    function drawDecode(p, t) {
      titleBanner("Decode = 往外蹦字");
      drawFrog(W / 2, 360, 1.15, "talk", t);

      // typewriter line
      const full = "你好，我来帮你把这件事说清楚……";
      const n = Math.floor(Math.min(1, Math.max(0, (p - 0.15) / 0.7)) * full.length);
      const shown = full.slice(0, Math.max(1, n));
      roundRect(100, 620, 880, 200, { width: 2.8 });
      text(shown + (Math.floor(t / 400) % 2 ? "▏" : ""), W / 2, 720, 34);

      // token meter
      if (p > 0.35) {
        text("生成速度 ≈ 每秒蹦几个字（tokens/s）", W / 2, 920, 28, "rgba(168,196,176,0.95)");
        const bars = 8;
        for (let i = 0; i < bars; i++) {
          const on = p > 0.4 + i * 0.05;
          roundRect(180 + i * 90, 980, 60, 80, {
            width: 2,
            color: on ? "rgba(125,255,163,0.9)" : "rgba(243,250,244,0.25)",
          });
        }
      }
      if (p > 0.75) {
        wrapText("要写的越长，Decode 时间越久", W / 2, 1200, 820, 32, "rgba(255,210,138,0.95)");
        text("≠ 一次性交整篇作文", W / 2, 1280, 28, "rgba(168,196,176,0.9)");
      }
    }

    function drawFactors(p, t) {
      titleBanner("什么在拖慢速度？");
      drawFrog(W / 2, 320, 0.95, "worry", t);
      const knobs = [
        { title: "输入长度", sub: "Prefill ↑", x: 0.28, y: 560 },
        { title: "输出长度", sub: "Decode ↑", x: 0.72, y: 560 },
        { title: "模型大小", sub: "算力更吃", x: 0.28, y: 900 },
        { title: "服务器排队", sub: "高峰更慢", x: 0.72, y: 900 },
      ];
      knobs.forEach((k, i) => {
        if (p < 0.15 + i * 0.15) return;
        const x = W * k.x;
        const y = k.y;
        circle(x, y, 90, { width: 3, color: i % 2 ? "rgba(125,255,163,0.85)" : "rgba(255,210,138,0.85)" });
        // dial
        const a = -Math.PI / 2 + p * Math.PI * 1.2 + i;
        line(x, y, x + Math.cos(a) * 55, y + Math.sin(a) * 55, { width: 4, color: "rgba(243,250,244,0.9)" });
        text(k.title, x, y + 130, 30);
        text(k.sub, x, y + 175, 24, "rgba(168,196,176,0.9)");
      });
      if (p > 0.85) {
        text("四件事叠在一起，等待就被放大", W / 2, 1220, 28, "rgba(168,196,176,0.95)");
      }
    }

    function drawTips(p, t) {
      titleBanner("少等待 · 五条干货");
      // 小呱基放右上，避免挡清单
      drawFrog(W * 0.82, 300, 0.7, "idle", t);
      const tips = [
        "少贴整份长文 → 先摘要再问",
        "一次只问一个问题",
        "写明：三点回答 / 一百字内",
        "长任务拆成多轮对话",
        "日常用轻量模型，重活再上大模型",
      ];
      tips.forEach((tip, i) => {
        if (p < 0.12 + i * 0.14) return;
        const y = 480 + i * 155;
        roundRect(70, y - 55, 940, 120, { width: 2.4, color: "rgba(125,255,163,0.45)" });
        chalkStroke([
          { x: 110, y: y },
          { x: 135, y: y + 24 },
          { x: 185, y: y - 24 },
        ], { width: 4, color: "rgba(125,255,163,0.95)" });
        text(tip, 210, y, 30, "rgba(243,250,244,0.95)", "left");
      });
    }

    function drawEnd(p, t) {
      titleBanner("记住这一句");
      drawFrog(W / 2, 420, 1.45, "talk", t);
      if (p > 0.25) {
        roundRect(100, 700, 880, 360, { width: 3.2, color: "rgba(125,255,163,0.85)" });
        wrapText("卡住多半在读题", W / 2, 800, 780, 40);
        wrapText("写得慢多半在吐字", W / 2, 880, 780, 40);
        wrapText("会拆任务，就能少干等", W / 2, 980, 780, 34, "rgba(255,210,138,0.95)");
      }
      if (p > 0.7) {
        text("下期见 · 呱基", W / 2, 1220, 36, "rgba(125,255,163,0.95)");
      }
    }

    // ---- Voice ----
    function pickVoice() {
      const voices = speechSynthesis.getVoices();
      return voices.find((v) => /zh[-_]CN/i.test(v.lang))
        || voices.find((v) => /^zh/i.test(v.lang))
        || null;
    }
    function speak(textStr) {
      if (muted || !("speechSynthesis" in window)) return;
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(textStr);
      u.lang = "zh-CN";
      u.rate = 1.0;
      u.pitch = 1.08;
      const v = pickVoice();
      if (v) u.voice = v;
      speechSynthesis.speak(u);
    }
    function stopSpeak() {
      if ("speechSynthesis" in window) speechSynthesis.cancel();
    }
    if ("speechSynthesis" in window) {
      speechSynthesis.onvoiceschanged = () => {};
    }

    // ---- Playback ----
    function totalDuration() {
      return SCENES.reduce((s, sc) => s + sc.duration, 0);
    }
    function sceneOffsets() {
      const out = [];
      let acc = 0;
      SCENES.forEach((sc) => { out.push(acc); acc += sc.duration; });
      return out;
    }
    const offsets = sceneOffsets();

    function setScene(i, restartVoice = true) {
      sceneIndex = Math.max(0, Math.min(SCENES.length - 1, i));
      sceneStart = performance.now();
      const sc = SCENES[sceneIndex];
      subZh.textContent = sc.zh;
      subTag.textContent = sc.tag;
      meta.textContent = `场景 ${sceneIndex + 1} / ${SCENES.length} · ${sc.title}`;
      [...sceneList.children].forEach((b, idx) => b.classList.toggle("active", idx === sceneIndex));
      if (restartVoice && playing) speak(sc.voice);
      updateProgress(0);
    }

    function updateProgress(localT) {
      const done = offsets[sceneIndex] + localT;
      bar.style.width = Math.min(100, (done / totalDuration()) * 100) + "%";
    }

    function tick(now) {
      if (!playing) return;
      const sc = SCENES[sceneIndex];
      const localT = now - sceneStart;
      drawScene(sceneIndex, localT, now);
      updateProgress(localT);
      if (localT >= sc.duration) {
        if (sceneIndex < SCENES.length - 1) {
          setScene(sceneIndex + 1, true);
        } else {
          playing = false;
          btnPlay.textContent = "再看一遍";
          stopSpeak();
          drawScene(sceneIndex, sc.duration, now);
          updateProgress(sc.duration);
          return;
        }
      }
      raf = requestAnimationFrame(tick);
    }

    function play() {
      playing = true;
      btnPlay.textContent = "暂停";
      setScene(sceneIndex, true);
      cancelAnimationFrame(raf);
      raf = requestAnimationFrame(tick);
    }
    function pause() {
      playing = false;
      btnPlay.textContent = "继续";
      stopSpeak();
      cancelAnimationFrame(raf);
    }
    function restart() {
      stopSpeak();
      sceneIndex = 0;
      playing = true;
      btnPlay.textContent = "暂停";
      setScene(0, true);
      cancelAnimationFrame(raf);
      raf = requestAnimationFrame(tick);
    }

    SCENES.forEach((sc, i) => {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = `${i + 1}. ${sc.title}`;
      b.addEventListener("click", () => {
        const wasPlaying = playing;
        stopSpeak();
        setScene(i, wasPlaying);
        drawScene(i, 0, performance.now());
        if (wasPlaying) {
          cancelAnimationFrame(raf);
          raf = requestAnimationFrame(tick);
        }
      });
      sceneList.appendChild(b);
    });

    btnPlay.addEventListener("click", () => {
      if (playing) pause();
      else {
        if (btnPlay.textContent === "再看一遍") restart();
        else play();
      }
    });
    btnRestart.addEventListener("click", restart);
    btnMute.addEventListener("click", () => {
      muted = !muted;
      btnMute.textContent = muted ? "配音：关" : "配音：开";
      if (muted) stopSpeak();
      else if (playing) speak(SCENES[sceneIndex].voice);
    });

    // Expose for recording scripts
    window.__GUAJI__ = {
      SCENES, drawScene, setScene, totalDuration,
      get playing() { return playing; },
      setMuted(v) { muted = v; },
      jump(i, localT) {
        sceneIndex = i;
        const sc = SCENES[i];
        subZh.textContent = sc.zh;
        subTag.textContent = sc.tag;
        meta.textContent = `场景 ${i + 1} / ${SCENES.length} · ${sc.title}`;
        [...sceneList.children].forEach((b, idx) => b.classList.toggle("active", idx === i));
        drawScene(i, localT, performance.now());
        const done = offsets[i] + localT;
        bar.style.width = Math.min(100, (done / totalDuration()) * 100) + "%";
      },
    };

    setScene(0, false);
    drawScene(0, 0, performance.now());
  </script>
</body>
</html>
