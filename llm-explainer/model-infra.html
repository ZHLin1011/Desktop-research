    // ---------- timing ----------
    let T=0, BEATS=[], GA=1;
    const clamp01=v=>v<0?0:v>1?1:v;
    const eOut=t=>1-Math.pow(1-clamp01(t),3);

    const lerp=(a,b,t)=>a+(b-a)*t;
    function beatIdx(k){return BEATS.findIndex(b=>b.key===k)}
    function at(k){const b=BEATS.find(b=>b.key===k);return b?Math.max(0,b.at-LEAD):1e9}
    function since(k){return T-at(k)}
    function pr(k,dur=800,delay=0){return eInOut((T-at(k)-delay)/dur)}

    function quadPts(x0,y0,cx,cy,x1,y1,step=6){const len=Math.hypot(cx-x0,cy-y0)+Math.hypot(x1-cx,y1-cy),n=Math.max(4,Math.ceil(len/step)),out=[];

        const n=Math.max(1,Math.round(lerp(1,24,many)));
        for(let i=0;i<n;i++){const c=i%6,r=Math.floor(i/6),px=n===1?800:700+c*56,py=n===1?y:y-90+r*60;
          person(px,py,.8,i===0?COL.ink:NET,i===0?ap("k1",400,4200):1);
          if(i===0&&since("k1")>4400||i>0)pill("字",px+18,py-28,{tone:GPU,size:16,padX:6,alpha:i===0?ap("k1",300,4600):clamp01((since("k2")-1200-i*60)/300)})}
        arrowLine(poly([{x:610,y},{x:660,y}]),pr("k1",400,3800),SAVE);
        if(since("k2")>0)withA(ap("k2",400,3200),()=>{pill("读一遍参数 → 几十人各得一字",540,y+150,{tone:GPU,size:28,padX:24})})});
      const r2=ap("k3",400);
      if(r2>0)withA(r2*emph("k3",.45),()=>{const y=1010;
        panel(110,y-90,470,190,1);
        ["你：帮我排个出游计划","AI：周六上午去植物园……","你：中午吃什么？","AI：本帮菜，推荐……"].forEach((s,i)=>text(s,140,y-58+i*36,{size:22,align:"left",color:i%2?GPU:COL.ink,alpha:.85,rise:0}));
        const ca=ap("k3",400,2400);
        if(ca>0)withA(ca,()=>{stroke(rrectPts(124,y-80,442,148,10),{color:SAVE,width:3.5,dash:[8,8],glow:0,tip:false,amp:0});pill("已算过 · 存起来",470,y-96,{tone:SAVE,size:22,padX:14})});
        const na=ap("k3",400,4200);if(na>0)withA(na,()=>{text("你：下午呢？",140,y+86,{size:22,align:"left",color:NET,weight:700,rise:0});text("← 只算这一句",330,y+86,{size:22,align:"left",color:NET,rise:0})});
        priceTag(800,y-10,1,"缓存部分 1–5 折",SAVE,ap("k3",400,7200))});
      const r3=ap("k4",400);
      if(r3>0)withA(r3,()=>{const y=1265,sh=pr("k4",900,1200);
        paramBlock(260,y,lerp(220,220,0),110,{label:"16 位",col:MOD});
        arrowLine(poly([{x:390,y},{x:500,y}]),pr("k4",400,800),MOD);
        paramBlock(lerp(260,600,sh),y,lerp(220,110,sh),lerp(110,70,sh),{label:sh>.6?"4 位":"",col:MOD,a:sh>0?1:0});
        text("装得下 · 跑得快",850,y,{size:32,weight:800,color:GPU,alpha:ap("k4",400,2400)})});
    };

    DRAW.you=function(){
      const rows=[640,900,1160];
      const head=(i,t,s,c,k)=>{text(t,720,rows[i]-30,{size:44,weight:800,color:c,alpha:ap(k,400),rise:0});text(s,720,rows[i]+26,{size:28,color:COL.mute,alpha:ap(k,400,600),rise:0})};
      withA(ap("y0",400),()=>rows.forEach(y=>stroke(rrectPts(110,y-100,360,200,16),{color:COL.faint,width:3,glow:0,tip:false,amp:0,dash:[8,10]})));
      const a1=ap("y1",400);
      if(a1>0)withA(a1*emph("y1",.4),()=>{const y=rows[0];iconClock(170,y,1.1,NET,since("y1")*.006);
        bubble("好的！周六上午去植物园……",230,y-30,{tone:GPU,size:24,maxW:230,shown:Math.floor((since("y1")-300)/60)});
        head(0,"快不快","首字多久出来 · 字蹦得多快",NET,"y1")});
      const a2=ap("y2",400);
      if(a2>0)withA(a2*emph("y2",.4),()=>{const y=rows[1];
        ctx.save();ctx.globalAlpha=GA;ctx.fillStyle="#fff";ctx.shadowColor="rgba(0,0,0,.12)";ctx.shadowBlur=14;ctx.beginPath();ctx.roundRect(130,y-40,320,80,14);ctx.fill();ctx.restore();
        stroke(rrectPts(130,y-40,320,80,14),{color:ERR,width:3,glow:0,tip:false,amp:0});dot(165,y,13,ERR,.9);text("!",165,y+1,{size:20,weight:800,color:"#fff",rise:0});
        text("服务繁忙，请稍后再试",310,y,{size:24,weight:700,color:ERR,rise:0});
        head(1,"稳不稳","高峰期扛不扛得住",ERR,"y2")});
      const a3=ap("y3",400);
      if(a3>0)withA(a3,()=>{const y=rows[2];
        [[150,"第 1 年"],[50,"第 2 年"],[16,"第 3 年"]].forEach(([h,l],i)=>{const hh=h*pr("y3",500,600+i*900);const x=180+i*110;
          if(hh>1)shape(rrectPts(x-30,y+70-hh,60,hh,6),{color:SAVE,width:3,fill:SAVE,fillA:.35,glow:0,tip:false,amp:0});text(l,x,y+92,{size:20,color:COL.mute,alpha:ap("y3",400,600+i*900),rise:0})});
        text("÷10",290,y-60,{size:30,weight:800,color:SAVE,alpha:ap("y3",400,2400),rise:0});
        head(2,"贵不贵","同水平模型 · 每年约降到 1/10",SAVE,"y3");
        pill("不少是 Infra 的功劳",720,y+90,{tone:SCH,size:26,alpha:ap("y3",400,6000),padX:22})});
    };

    DRAW.end=function(){
      const top=emph("e1",.5);
      withA(ap("e1",400)*top,()=>{chefHat(300,610,1.1,MOD,pr("e1",600));text("模型 = 大厨",300,700,{size:36,weight:800,color:MOD,rise:0});
        kitchen(780,585,.6,{p:pr("e1",800,1400),flame:ap("e1",400,2000)});text("Infra = 后厨",780,700,{size:36,weight:800,color:SCH,alpha:ap("e1",400,2000),rise:0})});
      const MAP=[["灶台","GPU 算力",GPU],["传菜","高速网络",NET],["排单","调度系统",SCH],["拼锅","批量推理",GPU],["备菜","缓存",SAVE],["存档 · 换人","断点续训 · 容错",ERR]];
      const D=Math.max(600,(span("e2")-800)/6);
      withA(emph("e2",.55),()=>MAP.forEach(([a,b,c],i)=>{const al=ap("e2",400,200+i*D);if(al<=0)return;const y=790+i*66;
        text(a,470,y,{size:32,weight:600,align:"right",alpha:al,rise:0});text("→",540,y,{size:30,color:COL.mute,alpha:al,rise:0});text(b,610,y,{size:32,weight:800,color:c,align:"left",alpha:al,rise:0})}));
      const a3=ap("e3",400);
      if(a3>0){text("别忘了水面下的那一大块",W/2,1235,{size:40,weight:800,alpha:a3});
        const wave=[];for(let i=0;i<=50;i++){const u=i/50;wave.push({x:270+u*540,y:1290+Math.sin(u*Math.PI*6)*7})}stroke(wave,{color:NET,width:5,prog:pr("e3",700,600),glow:0,amp:0})}
      withA(ap("bye",500),()=>frog(540,1355,.55,true));
    };

    // ---------- cover ----------
    function richLine(parts,cx,y,size,weight=800){
      const total=parts.reduce((s,[str,,sz])=>s+measure(str,sz||size,weight),0);let x=cx-total/2;
      for(const [str,color,sz,hl] of parts){const s=sz||size,w=measure(str,s,weight);
        if(hl){ctx.save();ctx.globalAlpha=.16;ctx.fillStyle=hl;ctx.beginPath();ctx.roundRect(x-6,y+s*.05,w+12,s*.42,8);ctx.fill();ctx.restore()}
        text(str,x,y,{size:s,color,weight,align:"left",rise:0});x+=w}}
    function drawCover(){
      BEATS=[];T=577;GA=1;SCD=0;
      ctx.drawImage(bgCanvas,0,0);
      pill("呱基讲 AI  ·  第 9 期",W/2,330,{tone:COL.green,size:30,padX:30});
      richLine([["什么是",COL.ink],["模型 Infra",SCH,null,SCH],["？",COL.ink]],W/2,470,96);
      text("AI 背后的那座「后厨」",W/2,575,{size:46,weight:700,color:COL.mute,rise:0});
      const WY=905;iceberg(540,WY,{tipLabel:0});
      phoneBody(540,WY-218,90,150,1);
      pill("模型",760,WY-80,{tone:MOD,size:34,padX:28});
      LAYERS.forEach(([l,c],i)=>pill(l,540,WY+90+i*88,{tone:c,size:28,padX:24}));
      text("你看到的，只是冰山一角",W/2,1550,{size:48,weight:800,rise:0});
      stroke(quadPts(290,1602,540,1618,790,1600),{color:SAVE,width:6,glow:0,tip:false});
      frog(540,1730,.7,true);
    }

    // ---------- render ----------
    function drawScene(index,localT){
      const sc=SCENES[index];BEATS=sc.beats;T=localT;GA=1;SCD=sc.duration;
      ctx.drawImage(bgCanvas,0,0);
      header(sc);
      (DRAW[sc.id]||(()=>{}))();
      subtitle(sc);
      const fade=clamp01(localT/260);if(fade<1){ctx.fillStyle=`rgba(255,255,255,${1-fade})`;ctx.fillRect(0,0,W,H)}
    }

    // ---------- player ----------
    let playing=false,muted=false,sceneIndex=0,sceneStart=0,raf=0;
    function pickVoice(){const v=speechSynthesis.getVoices();return v.find(x=>/zh[-_]CN/i.test(x.lang))||v.find(x=>/^zh/i.test(x.lang))||null}
    function speak(s){if(muted||!("speechSynthesis"in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(s);u.lang="zh-CN";u.rate=1.06;u.pitch=1.15;const v=pickVoice();if(v)u.voice=v;speechSynthesis.speak(u)}
    function stopSpeak(){if("speechSynthesis"in window)speechSynthesis.cancel()}
    function totalDuration(){return SCENES.reduce((s,sc)=>s+sc.duration,0)}
    const offsets=[];{let a=0;SCENES.forEach(sc=>{offsets.push(a);a+=sc.duration})}
    function setScene(i,rv=true){
      sceneIndex=Math.max(0,Math.min(SCENES.length-1,i));sceneStart=performance.now();
      const sc=SCENES[sceneIndex];
      meta.textContent=`场景 ${sceneIndex+1} / ${SCENES.length} · ${sc.tag}`;
      [...sceneList.children].forEach((b,idx)=>b.classList.toggle("active",idx===sceneIndex));
      if(rv&&playing)speak(sc.voice);updateProgress(0);
    }
    function updateProgress(localT){bar.style.width=Math.min(100,((offsets[sceneIndex]+localT)/totalDuration())*100)+"%"}
    function tick(now){
      if(!playing)return;const sc=SCENES[sceneIndex],localT=now-sceneStart;
      drawScene(sceneIndex,localT);updateProgress(localT);
      if(localT>=sc.duration){if(sceneIndex<SCENES.length-1)setScene(sceneIndex+1,true);else{playing=false;btnPlay.textContent="再看一遍";stopSpeak();drawScene(sceneIndex,sc.duration);updateProgress(sc.duration);return}}
      raf=requestAnimationFrame(tick);
    }
    function play(){playing=true;btnPlay.textContent="暂停";setScene(sceneIndex,true);cancelAnimationFrame(raf);raf=requestAnimationFrame(tick)}
    function pause(){playing=false;btnPlay.textContent="继续";stopSpeak();cancelAnimationFrame(raf)}
    function restart(){stopSpeak();sceneIndex=0;playing=true;btnPlay.textContent="暂停";setScene(0,true);cancelAnimationFrame(raf);raf=requestAnimationFrame(tick)}
    SCENES.forEach((sc,i)=>{const b=document.createElement("button");b.type="button";b.textContent=`${i+1}. ${sc.tag}`;
      b.addEventListener("click",()=>{const was=playing;stopSpeak();setScene(i,was);drawScene(i,0);if(was){cancelAnimationFrame(raf);raf=requestAnimationFrame(tick)}});sceneList.appendChild(b)});
    btnPlay.addEventListener("click",()=>{if(playing)pause();else{if(btnPlay.textContent==="再看一遍")restart();else play()}});
    btnRestart.addEventListener("click",restart);
    btnMute.addEventListener("click",()=>{muted=!muted;btnMute.textContent=muted?"配音：关":"配音：开";if(muted)stopSpeak();else if(playing)speak(SCENES[sceneIndex].voice)});
    window.__GUAJI__={
      SCENES,totalDuration,get playing(){return playing},setMuted(v){muted=v},
      drawAt(ms){
        let remain=ms,idx=0;
        while(idx<SCENES.length-1&&remain>=SCENES[idx].duration){remain-=SCENES[idx].duration;idx++}
        sceneIndex=idx;
        meta.textContent=`场景 ${idx+1} / ${SCENES.length} · ${SCENES[idx].tag}`;
        [...sceneList.children].forEach((b,j)=>b.classList.toggle("active",j===idx));
        drawScene(idx,remain);
        bar.style.width=Math.min(100,(ms/totalDuration())*100)+"%";
      },
      jump(i,localT){this.drawAt(offsets[i]+localT)},
      drawCover
    };
    if(new URLSearchParams(location.search).has("cover"))drawCover();
    else if(SCENES.length){setScene(0,false);drawScene(0,6000)}
  </script>
