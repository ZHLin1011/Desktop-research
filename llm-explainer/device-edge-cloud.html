    // ---------- timing ----------
    let T=0, BEATS=[], GA=1;
    const clamp01=v=>v<0?0:v>1?1:v;
    const eOut=t=>1-Math.pow(1-clamp01(t),3);
    const eInOut=t=>{t=clamp01(t);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2};
    const lerp=(a,b,t)=>a+(b-a)*t;
    function beatIdx(k){return BEATS.findIndex(b=>b.key===k)}
    function at(k){const b=BEATS.find(b=>b.key===k);return b?Math.max(0,b.at-LEAD):1e9}
    function since(k){return T-at(k)}
    function pr(k,dur=800,delay=0){return eInOut((T-at(k)-delay)/dur)}
    function ap(k,dur=450,delay=0){return eOut((T-at(k)-delay)/dur)}
    function emph(k,floor=0.32){const i=beatIdx(k),nb=BEATS[i+1];if(!nb)return 1;const t=T-(nb.at-LEAD);return t<=0?1:lerp(1,floor,eOut(t/450))}
    function withA(a,fn){const old=GA;GA=old*a;if(GA>0.002)fn();GA=old}

    function poly(vs,closed=false,step=6){const out=[];const L=closed?[...vs,vs[0]]:vs;

    function arcPts(cx,cy,r,a0,a1,step=6){const n=Math.max(2,Math.ceil(Math.abs(a1-a0)*r/step)),out=[];
      for(let i=0;i<=n;i++){const t=a0+(a1-a0)*i/n;out.push({x:cx+Math.cos(t)*r,y:cy+Math.sin(t)*r})}return out}
    function circlePts(cx,cy,r,start=-Math.PI/2){return arcPts(cx,cy,r,start,start+Math.PI*2)}
    function ellipsePts(cx,cy,rx,ry){const out=[];for(let i=0;i<=72;i++){const t=-Math.PI/2+i/72*Math.PI*2;out.push({x:cx+Math.cos(t)*rx,y:cy+Math.sin(t)*ry})}return out}
    function join(...parts){const out=[];for(const p of parts)for(const q of p){const l=out[out.length-1];if(l&&Math.hypot(l.x-q.x,l.y-q.y)<0.5)continue;out.push(q)}return out}

    function quadPts(x0,y0,cx,cy,x1,y1,step=6){const len=Math.hypot(cx-x0,cy-y0)+Math.hypot(x1-cx,y1-cy),n=Math.max(4,Math.ceil(len/step)),out=[];
      for(let i=0;i<=n;i++){const t=i/n,u=1-t;out.push({x:u*u*x0+2*u*t*cx+t*t*x1,y:u*u*y0+2*u*t*cy+t*t*y1})}return out}
    function cloudPts(x,y,s){
      const C=[[-70,15,42],[-15,-22,58],[55,-5,46],[92,20,30],[10,10,50]];
      const base=50*s,out=[];
      for(let i=0;i<=150;i++){const th=Math.PI+i/150*Math.PI*2,dx=Math.cos(th),dy=Math.sin(th);let best=0;
        for(const [cx,cy,r] of C){const ox=cx*s,oy=cy*s,R=r*s,b=dx*ox+dy*oy,c=ox*ox+oy*oy-R*R,disc=b*b-c;if(disc>=0){const t=b+Math.sqrt(disc);if(t>best)best=t}}
        let px=dx*best,py=dy*best;if(py>base){const t=base/dy;px=dx*t;py=base}
        out.push({x:x+px,y:y+py})}

    function along(pts,u){u=clamp01(u);const f=u*(pts.length-1),i=Math.floor(f),fr=f-i;const A=pts[i],B=pts[Math.min(pts.length-1,i+1)];

    function rough(pts,amp){if(!amp)return pts;const s=pts[0].x*.37+pts[0].y*.91+pts.length*.13;
      return pts.map((q,i)=>({x:q.x+(Math.sin(i*.31+s)*.6+Math.sin(i*.09+s*1.7)*.4)*amp,y:q.y+(Math.cos(i*.27+s*1.3)*.6+Math.sin(i*.06+s*.7)*.4)*amp}))}

      if(dash)ctx.setLineDash(dash);
      if(glow>0){ctx.globalAlpha=A*glow;ctx.lineWidth=width*3.4;ctx.stroke(path)}

      if(grain&&!dash){ctx.setLineDash([1.4,5]);ctx.globalAlpha=A*.28;ctx.lineWidth=width*.5;ctx.strokeStyle="#ffffff";ctx.stroke(path)}
      ctx.restore();
      if(tip&&prog<1){ctx.save();ctx.globalAlpha=A;ctx.fillStyle="#ffffff";ctx.beginPath();ctx.arc(end.x,end.y,width*.85,0,Math.PI*2);ctx.fill();ctx.restore()}

    function drawScene(index,localT){
      const sc=SCENES[index];BEATS=sc.beats;T=localT;GA=1;
      ctx.drawImage(bgCanvas,0,0);
      header(sc);
      (DRAW[sc.id]||(()=>{}))();

    // ---------- player ----------
    let playing=false,muted=false,sceneIndex=0,sceneStart=0,raf=0;
    function pickVoice(){const v=speechSynthesis.getVoices();return v.find(x=>/zh[-_]CN/i.test(x.lang))||v.find(x=>/^zh/i.test(x.lang))||null}
    function speak(s){if(muted||!("speechSynthesis"in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(s);u.lang="zh-CN";u.rate=1.06;u.pitch=1.15;const v=pickVoice();if(v)u.voice=v;speechSynthesis.speak(u)}
    function stopSpeak(){if("speechSynthesis"in window)speechSynthesis.cancel()}
    function totalDuration(){return SCENES.reduce((s,sc)=>s+sc.duration,0)}
    const offsets=[];{let a=0;SCENES.forEach(sc=>{offsets.push(a);a+=sc.duration})}
    function setScene(i,rv=true){
      sceneIndex=Math.max(0,Math.min(SCENES.length-1,i));sceneStart=performance.now();
      const sc=SCENES[sceneIndex];
      meta.textContent=`场景 ${sceneIndex+1} / ${SCENES.length} · ${sc.tag}`;
      [...sceneList.children].forEach((b,idx)=>b.classList.toggle("active",idx===sceneIndex));
      if(rv&&playing)speak(sc.voice);updateProgress(0);
    }
    function updateProgress(localT){bar.style.width=Math.min(100,((offsets[sceneIndex]+localT)/totalDuration())*100)+"%"}
    function tick(now){
      if(!playing)return;const sc=SCENES[sceneIndex],localT=now-sceneStart;
      drawScene(sceneIndex,localT);updateProgress(localT);
      if(localT>=sc.duration){if(sceneIndex<SCENES.length-1)setScene(sceneIndex+1,true);else{playing=false;btnPlay.textContent="再看一遍";stopSpeak();drawScene(sceneIndex,sc.duration);updateProgress(sc.duration);return}}
      raf=requestAnimationFrame(tick);
    }
    function play(){playing=true;btnPlay.textContent="暂停";setScene(sceneIndex,true);cancelAnimationFrame(raf);raf=requestAnimationFrame(tick)}
    function pause(){playing=false;btnPlay.textContent="继续";stopSpeak();cancelAnimationFrame(raf)}
    function restart(){stopSpeak();sceneIndex=0;playing=true;btnPlay.textContent="暂停";setScene(0,true);cancelAnimationFrame(raf);raf=requestAnimationFrame(tick)}
    SCENES.forEach((sc,i)=>{const b=document.createElement("button");b.type="button";b.textContent=`${i+1}. ${sc.tag}`;
      b.addEventListener("click",()=>{const was=playing;stopSpeak();setScene(i,was);drawScene(i,0);if(was){cancelAnimationFrame(raf);raf=requestAnimationFrame(tick)}});sceneList.appendChild(b)});
    btnPlay.addEventListener("click",()=>{if(playing)pause();else{if(btnPlay.textContent==="再看一遍")restart();else play()}});
    btnRestart.addEventListener("click",restart);
    btnMute.addEventListener("click",()=>{muted=!muted;btnMute.textContent=muted?"配音：关":"配音：开";if(muted)stopSpeak();else if(playing)speak(SCENES[sceneIndex].voice)});
    window.__GUAJI__={
      SCENES,totalDuration,get playing(){return playing},setMuted(v){muted=v},
      drawAt(ms){
        let remain=ms,idx=0;
        while(idx<SCENES.length-1&&remain>=SCENES[idx].duration){remain-=SCENES[idx].duration;idx++}
        sceneIndex=idx;
        meta.textContent=`场景 ${idx+1} / ${SCENES.length} · ${SCENES[idx].tag}`;
        [...sceneList.children].forEach((b,j)=>b.classList.toggle("active",j===idx));
        drawScene(idx,remain);
        bar.style.width=Math.min(100,(ms/totalDuration())*100)+"%";
      },
      jump(i,localT){this.drawAt(offsets[i]+localT)}
    };
    if(SCENES.length){setScene(0,false);drawScene(0,6000)}
  </script>
</body>
</html>
