  <script>
    const canvas=document.getElementById("stage"), ctx=canvas.getContext("2d");
    const bar=document.getElementById("bar"), meta=document.getElementById("meta");
    const btnPlay=document.getElementById("btnPlay"), btnRestart=document.getElementById("btnRestart");
    const btnMute=document.getElementById("btnMute"), sceneList=document.getElementById("sceneList");
    const W=canvas.width, H=canvas.height;
    const SAFE_TOP=240, SAFE_BOTTOM=150, SUB_H=290, CONTENT_BOTTOM=H-SAFE_BOTTOM-SUB_H;
    const C_D="rgba(141,255,156,0.95)", C_E="rgba(154,215,255,0.95)", C_C="rgba(255,213,154,0.95)";

    const SCENES=[
      {id:"hook",title:"引出",tag:"常见疑问",
        zh:"嗨，我是呱基。很多人一提 AI，就想到云端大模型。其实完整说法常叫「端边云」——三层一起干活，不只在云里。",
        voice:"嗨，我是呱基。很多人一提 AI，就想到云端大模型。其实完整说法常叫端边云——三层一起干活，不只在云里。",
        duration:11140,
        beats:[
          {key:"intro",at:0,text:"嗨，我是呱基。"},
          {key:"cloud",at:1688,text:"很多人一提 AI，就想到云端大模型。"},
          {key:"three",at:5739,text:"其实完整说法常叫端边云——三层一起干活，不只在云里。"},
        ]},
      {id:"map",title:"三层总览",tag:"先记位置",
        zh:"先记位置：端，是你手里的设备；边，是离你不远的小机房或网关；云，是远处的大数据中心。越靠近你，响应往往越快；越往云端，算力通常越大。",
        voice:"先记位置：端，是你手里的设备；边，是离你不远的小机房或网关；云，是远处的大数据中心。越靠近你，响应往往越快；越往云端，算力通常越大。",
        duration:13900,
        beats:[
          {key:"title",at:0,text:"先记位置："},
          {key:"d",at:970,text:"端，是你手里的设备；"},
          {key:"e",at:3233,text:"边，是离你不远的小机房或网关；"},
          {key:"c",at:6142,text:"云，是远处的大数据中心。"},
          {key:"rule",at:8728,text:"越靠近你，响应往往越快；越往云端，算力通常越大。"},
        ]},
      {id:"device",title:"端",tag:"终端层",
        zh:"端，就是手机、电脑、汽车、摄像头这些终端。适合要立刻反应、或数据不想乱传的事，比如语音唤醒、本地滤镜、简单识别。",
        voice:"端，就是手机、电脑、汽车、摄像头这些终端。适合要立刻反应、或数据不想乱传的事，比如语音唤醒、本地滤镜、简单识别。",
        duration:12292,
        beats:[
          {key:"title",at:0,text:"端，就是手机、电脑、汽车、摄像头这些终端。"},
          {key:"use",at:4983,text:"适合要立刻反应、或数据不想乱传的事，"},
          {key:"ex",at:8637,text:"比如语音唤醒、本地滤镜、简单识别。"},
        ]},
      {id:"edge",title:"边",tag:"边缘层",
        zh:"边，夹在中间。常见像工厂里的边缘网关、5G 基站旁的边缘节点、园区机房。它能就近处理一批数据，比全送上云更省带宽、也更低延迟。",
        voice:"边，夹在中间。常见像工厂里的边缘网关、5G 基站旁的边缘节点、园区机房。它能就近处理一批数据，比全送上云更省带宽、也更低延迟。",
        duration:12964,
        beats:[
          {key:"title",at:0,text:"边，夹在中间。"},
          {key:"where",at:1662,text:"常见像工厂里的边缘网关、5G 基站旁的边缘节点、园区机房。"},
          {key:"why",at:7645,text:"它能就近处理一批数据，比全送上云更省带宽、也更低延迟。"},
        ]},
      {id:"cloud",title:"云",tag:"云端层",
        zh:"云，负责扛大活：训练大模型、存海量数据、做全局分析。能力强、更新快，但要联网，路程也更远。",
        voice:"云，负责扛大活：训练大模型、存海量数据、做全局分析。能力强、更新快，但要联网，路程也更远。",
        duration:10396,
        beats:[
          {key:"title",at:0,text:"云，负责扛大活："},
          {key:"jobs",at:2012,text:"训练大模型、存海量数据、做全局分析。"},
          {key:"trade",at:6036,text:"能力强、更新快，但要联网，路程也更远。"},
        ]},
      {id:"examples",title:"例子",tag:"怎么配合",
        zh:"举三个例子。智能产线：端侧传感器报警，边侧做质检推理，云端汇总全厂报表。路口监控：摄像头在端，路边盒子在边，城市大脑在云。智能驾驶：车上先刹停，路边协同感知，云端优化地图与策略。",
        voice:"举三个例子。智能产线：端侧传感器报警，边侧做质检推理，云端汇总全厂报表。路口监控：摄像头在端，路边盒子在边，城市大脑在云。智能驾驶：车上先刹停，路边协同感知，云端优化地图与策略。",
        duration:19852,
        beats:[
          {key:"title",at:0,text:"举三个例子。"},
          {key:"f1",at:1393,text:"智能产线：端侧传感器报警，边侧做质检推理，云端汇总全厂报表。"},
          {key:"f2",at:8010,text:"路口监控：摄像头在端，路边盒子在边，城市大脑在云。"},
          {key:"f3",at:13582,text:"智能驾驶：车上先刹停，路边协同感知，云端优化地图与策略。"},
        ]},
      {id:"end",title:"趋势收尾",tag:"记住一句",
        zh:"未来趋势：更多模型会下沉到边和端；端边云会按任务自动分工；隐私与可控也会更受重视。记住：不是非此即彼，而是三层搭配。我是呱基，我们下期见。",
        voice:"未来趋势：更多模型会下沉到边和端；端边云会按任务自动分工；隐私与可控也会更受重视。记住：不是非此即彼，而是三层搭配。我是呱基，我们下期见。",
        duration:14860,
        beats:[
          {key:"trend",at:0,text:"未来趋势：更多模型会下沉到边和端；端边云会按任务自动分工；隐私与可控也会更受重视。"},
          {key:"sum",at:8491,text:"记住：不是非此即彼，而是三层搭配。"},
          {key:"bye",at:12383,text:"我是呱基，我们下期见。"},
        ]},
    ];

    let playing=false,muted=false,sceneIndex=0,sceneStart=0,raf=0,seed=1,activeBeats=null;
    function rand(){seed=(seed*16807)%2147483647;return (seed-1)/2147483646}
    function wobble(a=2.8){return (rand()-0.5)*a}
    function easeOut(t){return 1-Math.pow(1-Math.min(1,Math.max(0,t)),3)}
    function clamp01(t){return Math.min(1,Math.max(0,t))}
    function beatAt(key){const b=(activeBeats||[]).find(x=>x.key===key);return b?b.at:Infinity}
    function show(localT,key,dur=420){return easeOut((localT-beatAt(key))/dur)}
    function listShow(localT,key,i,count,span){return easeOut((localT-(beatAt(key)+i*(span/Math.max(1,count))))/380)}

    function clear(){
      ctx.fillStyle="#071018";ctx.fillRect(0,0,W,H);
      seed=11;ctx.fillStyle="rgba(255,255,255,0.035)";
      for(let i=0;i<220;i++) ctx.fillRect(rand()*W,rand()*H,1.8,1.8);
    }
    function chalkStroke(points,opts={}){
      const {color="rgba(244,247,251,0.94)",width=3.2,alpha=1}=opts;
      if(points.length<2) return;
      const drawOnce=(amp,wMul,aMul)=>{
        ctx.save();ctx.globalAlpha=alpha*aMul;ctx.strokeStyle=color;ctx.lineWidth=width*wMul;ctx.lineCap="round";ctx.lineJoin="round";
        ctx.beginPath();ctx.moveTo(points[0].x+wobble(amp),points[0].y+wobble(amp));
        for(let i=1;i<points.length;i++){
          const p=points[i],prev=points[i-1];
          ctx.quadraticCurveTo(prev.x+wobble(amp*.9),prev.y+wobble(amp*.9),(prev.x+p.x)/2+wobble(amp),(prev.y+p.y)/2+wobble(amp));
        }
        const last=points[points.length-1];ctx.lineTo(last.x+wobble(amp*.4),last.y+wobble(amp*.4));ctx.stroke();ctx.restore();
      };
      drawOnce(2.4,1,1);drawOnce(3.6,1.7,.2);drawOnce(1.4,.7,.35);
    }
    function line(x1,y1,x2,y2,o){chalkStroke([{x:x1,y:y1},{x:x2,y:y2}],o)}
    function circle(cx,cy,r,o={}){const pts=[];for(let i=0;i<=28;i++){const t=(i/28)*Math.PI*2;pts.push({x:cx+Math.cos(t)*r,y:cy+Math.sin(t)*r})}chalkStroke(pts,o)}
    function roundRect(x,y,w,h,o){chalkStroke([{x,y},{x:x+w,y},{x:x+w,y:y+h},{x,y:y+h},{x,y}],o)}
    function text(str,x,y,size=40,color="rgba(244,247,251,0.96)",align="center"){
      ctx.save();ctx.fillStyle=color;ctx.font=`700 ${size}px "PingFang SC","Noto Sans SC",sans-serif`;
      ctx.textAlign=align;ctx.textBaseline="middle";ctx.fillText(str,x+wobble(.4),y+wobble(.4));ctx.restore();
    }
    function wrapText(str,x,y,maxWidth,size=34,color="rgba(244,247,251,0.95)",lineH=1.35){
      ctx.save();ctx.fillStyle=color;ctx.font=`600 ${size}px "PingFang SC","Noto Sans SC",sans-serif`;
      ctx.textAlign="center";ctx.textBaseline="middle";
      const chars=[...str];let cur="";const lines=[];
      for(const ch of chars){const test=cur+ch;if(ctx.measureText(test).width>maxWidth&&cur){lines.push(cur);cur=ch}else cur=test}
      if(cur) lines.push(cur);
      const totalH=(lines.length-1)*size*lineH;
      lines.forEach((ln,i)=>ctx.fillText(ln,x,y-totalH/2+i*size*lineH));ctx.restore();
    }
    function ground(){const pts=[];for(let x=70;x<W-70;x+=34) pts.push({x,y:CONTENT_BOTTOM+10+Math.sin(x*.016)*9});chalkStroke(pts,{width:2.8,alpha:.8})}
    function stars(t){seed=77;for(let i=0;i<50;i++){const x=rand()*W,y=SAFE_TOP+rand()*(CONTENT_BOTTOM-SAFE_TOP)*.5;const a=.2+.55*(.5+.5*Math.sin(t*.004+i*1.7));ctx.fillStyle=`rgba(244,247,251,${a})`;ctx.fillRect(x,y,2.2,2.2)}}
    function drawFrog(x,y,scale=1,mood="idle",t=0){
      const s=scale,cy=y+Math.sin(t*.006)*4*s;
      circle(x,cy,46*s,{width:3.4,color:C_D});
      circle(x-20*s,cy-30*s,15*s,{width:2.8});circle(x+20*s,cy-30*s,15*s,{width:2.8});
      ctx.save();ctx.fillStyle="#071018";ctx.beginPath();ctx.arc(x-20*s,cy-30*s,5*s,0,Math.PI*2);ctx.arc(x+20*s,cy-30*s,5*s,0,Math.PI*2);ctx.fill();ctx.restore();
      if(mood==="talk"){const open=5+Math.abs(Math.sin(t*.025))*7;chalkStroke([{x:x-14*s,y:cy+10*s},{x:x,y:cy+10*s+open},{x:x+14*s,y:cy+10*s}],{width:2.6})}
      else chalkStroke([{x:x-14*s,y:cy+12*s},{x:x,y:cy+20*s},{x:x+14*s,y:cy+12*s}],{width:2.6});
      chalkStroke([{x:x-22*s,y:cy+34*s},{x:x-42*s,y:cy+60*s},{x:x-16*s,y:cy+56*s}],{width:3.2,color:C_D});
      chalkStroke([{x:x+22*s,y:cy+34*s},{x:x+42*s,y:cy+60*s},{x:x+16*s,y:cy+56*s}],{width:3.2,color:C_D});
      text("呱基",x,cy+84*s,26*Math.min(1.15,s),C_D);
    }
    function titleBig(str,y=SAFE_TOP+36){text(str,W/2,y,58,"rgba(154,215,255,0.98)")}
    function drawSubtitle(sc,localT){
      const bandTop=H-SAFE_BOTTOM-SUB_H;
      const g=ctx.createLinearGradient(0,bandTop-50,0,H-SAFE_BOTTOM);
      g.addColorStop(0,"rgba(7,16,24,0)");g.addColorStop(.28,"rgba(7,16,24,0.8)");g.addColorStop(1,"rgba(7,16,24,0.92)");
      ctx.fillStyle=g;ctx.fillRect(0,bandTop-50,W,H-SAFE_BOTTOM-(bandTop-50));
      let shown="";
      for(const b of sc.beats){
        if(localT<b.at) break;
        const nextAt=sc.beats.find(x=>x.at>b.at)?.at ?? sc.duration;
        const frac=clamp01((localT-b.at)/Math.max(1,nextAt-b.at)*.92);
        shown+=b.text.slice(0,Math.max(1,Math.floor(frac*b.text.length)));
      }
      if(!shown) shown=(sc.beats[0]?.text||"").slice(0,1);
      wrapText(shown,W/2,bandTop+SUB_H*.38,900,38,"rgba(244,247,251,0.98)",1.34);
      text(sc.tag,W/2,bandTop+SUB_H*.72,24,"rgba(154,215,255,0.88)");
    }

    function drawScene(index,localT,totalT){
      clear();seed=900+index*83+Math.floor(localT/70);stars(totalT);ground();
      const sc=SCENES[index];activeBeats=sc.beats;
      switch(sc.id){
        case"hook":drawHook(localT,totalT);break;
        case"map":drawMap(localT,totalT);break;
        case"device":drawDevice(localT,totalT);break;
        case"edge":drawEdge(localT,totalT);break;
        case"cloud":drawCloud(localT,totalT);break;
        case"examples":drawExamples(localT,totalT);break;
        case"end":drawEnd(localT,totalT);break;
      }
      drawSubtitle(sc,localT);
      const fade=clamp01(localT/280);
      if(fade<1){ctx.fillStyle=`rgba(7,16,24,${1-fade})`;ctx.fillRect(0,0,W,H)}
    }

    function drawHook(localT,t){
      if(show(localT,"intro")>0){titleBig("不只在云里");drawFrog(W/2,420,1.15,"talk",t)}
      if(show(localT,"cloud")>0){
        roundRect(180,620,720,160,{width:3,color:C_C});
        text("云端大模型？",W/2,700,44,C_C);
      }
      if(show(localT,"three")>0){
        [["端",C_D,180],["边",C_E,540],["云",C_C,900]].forEach(([lab,c,x],i)=>{
          const a=listShow(localT,"three",i,3,3500); if(a<=0) return;
          ctx.save();ctx.globalAlpha=a;
          circle(x,920,70,{width:3.2,color:c}); text(lab,x,920,48,c);
          ctx.restore();
        });
        text("三层一起干活",W/2,1060,34,"rgba(244,247,251,0.95)");
      }
    }

    function drawMap(localT,t){
      if(show(localT,"title")>0){titleBig("先记位置");drawFrog(W*.88,SAFE_TOP+110,.55,"idle",t)}
      const rows=[
        {key:"d",n:"端",s:"手里的设备",c:C_D,y:400},
        {key:"e",n:"边",s:"附近小机房 / 网关",c:C_E,y:600},
        {key:"c",n:"云",s:"远处大数据中心",c:C_C,y:800},
      ];
      rows.forEach(r=>{
        const a=show(localT,r.key,480); if(a<=0) return;
        ctx.save();ctx.globalAlpha=a;
        roundRect(90,r.y,900,160,{width:3.2,color:r.c});
        text(r.n,220,r.y+80,52,r.c,"left");
        text(r.s,720,r.y+80,34,"rgba(244,247,251,0.95)");
        ctx.restore();
      });
      if(show(localT,"rule")>0){
        text("越近越快 · 越远越大算力",W/2,1040,32,"rgba(255,213,154,0.95)");
        // 箭头示意近→远
        line(160,1085,920,1085,{width:3,color:"rgba(154,215,255,0.7)"});
        line(920,1085,890,1065,{width:3,color:"rgba(154,215,255,0.7)"});
        line(920,1085,890,1105,{width:3,color:"rgba(154,215,255,0.7)"});
        text("近",140,1120,24,C_D); text("远",940,1120,24,C_C);
      }
    }

    function drawDevice(localT,t){
      if(show(localT,"title")>0){
        titleBig("端 · 终端");
        const items=["手机","电脑","汽车","摄像头"];
        items.forEach((lab,i)=>{
          const a=listShow(localT,"title",i,4,4200); if(a<=0) return;
          ctx.save();ctx.globalAlpha=a;
          const x=130+i*230;
          roundRect(x,420,200,140,{width:2.8,color:C_D});
          text(lab,x+100,490,34,C_D);
          ctx.restore();
        });
      }
      if(show(localT,"use")>0){
        roundRect(100,620,880,160,{width:3,color:C_D});
        text("立刻反应 · 数据少外传",W/2,700,36,C_D);
      }
      if(show(localT,"ex")>0){
        ["语音唤醒","本地滤镜","简单识别"].forEach((lab,i)=>{
          const a=listShow(localT,"ex",i,3,3000); if(a<=0) return;
          ctx.save();ctx.globalAlpha=a;
          const y=840+i*90;
          roundRect(160,y,760,70,{width:2.4,color:"rgba(141,255,156,0.55)"});
          text("· "+lab,W/2,y+35,32);
          ctx.restore();
        });
      }
    }

    function drawEdge(localT,t){
      if(show(localT,"title")>0){
        titleBig("边 · 夹在中间");
        // 端 - 边 - 云 小示意
        text("端",220,430,36,C_D); text("边",W/2,430,44,C_E); text("云",860,430,36,C_C);
        line(280,430,460,430,{width:3,color:"rgba(244,247,251,0.5)"});
        line(620,430,800,430,{width:3,color:"rgba(244,247,251,0.5)"});
        circle(W/2,430,70,{width:3.2,color:C_E});
      }
      if(show(localT,"where")>0){
        [["工厂边缘网关","5G 边缘节点","园区机房"],[C_E,C_E,C_E]].forEach(()=>{});
        ["工厂边缘网关","5G 边缘节点","园区机房"].forEach((lab,i)=>{
          const a=listShow(localT,"where",i,3,5000); if(a<=0) return;
          ctx.save();ctx.globalAlpha=a;
          const y=560+i*120;
          roundRect(120,y,840,95,{width:2.8,color:C_E});
          text(lab,W/2,y+48,36,C_E);
          ctx.restore();
        });
      }
      if(show(localT,"why")>0){
        text("就近算 · 省带宽 · 更低延迟",W/2,1000,34,"rgba(255,213,154,0.95)");
      }
    }

    function drawCloud(localT,t){
      if(show(localT,"title")>0){
        titleBig("云 · 扛大活");
        // 云朵简笔画
        chalkStroke([{x:300,y:520},{x:360,y:460},{x:460,y:450},{x:540,y:480},{x:620,y:450},{x:720,y:470},{x:780,y:530},{x:720,y:580},{x:360,y:590},{x:300,y:520}],{width:3.2,color:C_C});
        text("大数据中心",W/2,640,34,C_C);
      }
      if(show(localT,"jobs")>0){
        ["训练大模型","存海量数据","做全局分析"].forEach((lab,i)=>{
          const a=listShow(localT,"jobs",i,3,3500); if(a<=0) return;
          ctx.save();ctx.globalAlpha=a;
          const x=110+i*310;
          roundRect(x,720,280,140,{width:2.8,color:C_C});
          text(lab,x+140,790,30,C_C);
          ctx.restore();
        });
      }
      if(show(localT,"trade")>0){
        roundRect(120,920,840,120,{width:3,color:"rgba(255,213,154,0.7)"});
        text("强且新 · 但要联网、路程更远",W/2,980,32,C_C);
      }
    }

    function drawExamples(localT,t){
      if(show(localT,"title")>0) titleBig("三个例子");
      const cards=[
        {key:"f1",title:"智能产线",flow:"传感(端) → 质检(边) → 报表(云)",c:C_D},
        {key:"f2",title:"路口监控",flow:"摄像头(端) → 路边盒(边) → 城市大脑(云)",c:C_E},
        {key:"f3",title:"智能驾驶",flow:"车上刹停(端) → 路边协同(边) → 地图策略(云)",c:C_C},
      ];
      cards.forEach((c,i)=>{
        const a=show(localT,c.key,500); if(a<=0) return;
        const y=400+i*210;
        ctx.save();ctx.globalAlpha=a;
        roundRect(70,y,940,180,{width:3.2,color:c.c});
        text(c.title,200,y+55,40,c.c,"left");
        text(c.flow,W/2,y+120,28,"rgba(244,247,251,0.95)");
        ctx.restore();
      });
    }

    function drawEnd(localT,t){
      if(show(localT,"trend")>0){
        titleBig("未来趋势");
        drawFrog(W*.88,SAFE_TOP+110,.55,"idle",t);
        const tips=["模型更多下沉到边和端","按任务自动分工","更重视隐私与可控"];
        tips.forEach((lab,i)=>{
          const a=listShow(localT,"trend",i,3,7000); if(a<=0) return;
          ctx.save();ctx.globalAlpha=a;
          const y=420+i*150;
          roundRect(100,y,880,120,{width:2.8,color:i===0?C_D:i===1?C_E:C_C});
          text((i+1)+". "+lab,W/2,y+60,34);
          ctx.restore();
        });
      }
      if(show(localT,"sum")>0){
        roundRect(100,900,880,110,{width:3,color:"rgba(255,213,154,0.9)"});
        text("不是非此即彼，而是三层搭配",W/2,955,34,C_C);
      }
      if(show(localT,"bye")>0) text("下期见",W/2,1080,40,C_D);
    }

    function pickVoice(){const v=speechSynthesis.getVoices();return v.find(x=>/zh[-_]CN/i.test(x.lang))||v.find(x=>/^zh/i.test(x.lang))||null}
    function speak(s){if(muted||!("speechSynthesis"in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(s);u.lang="zh-CN";u.rate=1.06;u.pitch=1.15;const v=pickVoice();if(v)u.voice=v;speechSynthesis.speak(u)}
    function stopSpeak(){if("speechSynthesis"in window)speechSynthesis.cancel()}
    function totalDuration(){return SCENES.reduce((s,sc)=>s+sc.duration,0)}
    function sceneOffsets(){const o=[];let a=0;SCENES.forEach(sc=>{o.push(a);a+=sc.duration});return o}
    const offsets=sceneOffsets();
    function setScene(i,rv=true){
      sceneIndex=Math.max(0,Math.min(SCENES.length-1,i));sceneStart=performance.now();
      const sc=SCENES[sceneIndex];activeBeats=sc.beats;
      meta.textContent=`场景 ${sceneIndex+1} / ${SCENES.length} · ${sc.title}`;
      [...sceneList.children].forEach((b,idx)=>b.classList.toggle("active",idx===sceneIndex));
      if(rv&&playing) speak(sc.voice); updateProgress(0);
    }
    function updateProgress(localT){bar.style.width=Math.min(100,((offsets[sceneIndex]+localT)/totalDuration())*100)+"%"}
    function tick(now){
      if(!playing)return;const sc=SCENES[sceneIndex],localT=now-sceneStart;
      drawScene(sceneIndex,localT,now);updateProgress(localT);
      if(localT>=sc.duration){if(sceneIndex<SCENES.length-1)setScene(sceneIndex+1,true);else{playing=false;btnPlay.textContent="再看一遍";stopSpeak();drawScene(sceneIndex,sc.duration,now);updateProgress(sc.duration);return}}
      raf=requestAnimationFrame(tick);
    }
    function play(){playing=true;btnPlay.textContent="暂停";setScene(sceneIndex,true);cancelAnimationFrame(raf);raf=requestAnimationFrame(tick)}
    function pause(){playing=false;btnPlay.textContent="继续";stopSpeak();cancelAnimationFrame(raf)}
    function restart(){stopSpeak();sceneIndex=0;playing=true;btnPlay.textContent="暂停";setScene(0,true);cancelAnimationFrame(raf);raf=requestAnimationFrame(tick)}
    SCENES.forEach((sc,i)=>{const b=document.createElement("button");b.type="button";b.textContent=`${i+1}. ${sc.title}`;
      b.addEventListener("click",()=>{const was=playing;stopSpeak();setScene(i,was);drawScene(i,0,performance.now());if(was){cancelAnimationFrame(raf);raf=requestAnimationFrame(tick)}});sceneList.appendChild(b)});
    btnPlay.addEventListener("click",()=>{if(playing)pause();else{if(btnPlay.textContent==="再看一遍")restart();else play()}});
    btnRestart.addEventListener("click",restart);
    btnMute.addEventListener("click",()=>{muted=!muted;btnMute.textContent=muted?"配音：关":"配音：开";if(muted)stopSpeak();else if(playing)speak(SCENES[sceneIndex].voice)});
    window.__GUAJI__={
      SCENES,totalDuration,get playing(){return playing},setMuted(v){muted=v},
      drawAt(ms){
        let remain=ms,idx=0;
        while(idx<SCENES.length-1&&remain>=SCENES[idx].duration){remain-=SCENES[idx].duration;idx++}
        sceneIndex=idx;activeBeats=SCENES[idx].beats;
        meta.textContent=`场景 ${idx+1} / ${SCENES.length} · ${SCENES[idx].title}`;
        [...sceneList.children].forEach((b,j)=>b.classList.toggle("active",j===idx));
        drawScene(idx,remain,ms);
        bar.style.width=Math.min(100,(ms/totalDuration())*100)+"%";
      },
      jump(i,localT){this.drawAt(offsets[i]+localT)}
    };
    setScene(0,false);drawScene(0,3000,performance.now());
  </script>
